services:
  db:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: ${ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      TZ: Europe/Berlin
    volumes:
      - db_data:/var/lib/mysql
    restart: unless-stopped
    networks:
      - internal

  web:
    build:
      context: .
      dockerfile: Dockerfile.legacy
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      # Database install routine
      INSTALL_ACTION: basic
      DB_INIT_MODE: drop_data
      ROOT_PASSWORD: ${ROOT_PASSWORD}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_AUTH: ${SMTP_AUTH}
      SMTP_SECURE: ${SMTP_SECURE}
      SMTP_SENDER: ${SMTP_SENDER}
      FEEDBACK_ADDRESS: ${FEEDBACK_ADDRESS}
      XML_SUBMIT_ADDRESS: ${XML_SUBMIT_ADDRESS}
      SIMULATE_EMAIL: "false"
      TZ: Europe/Berlin
      ELMO_API_KEY: ${ELMO_API_KEY}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY}
      GOOGLE_MAPS_MAP_ID: ${GOOGLE_MAPS_MAP_ID:-}
      ERNIE_URL: ${ERNIE_URL}
      ERNIE_API_KEY: ${ERNIE_API_KEY}
      DATACITE_JSONLD_CONTEXT_URL: ${DATACITE_JSONLD_CONTEXT_URL}
      DATA_UPLOAD_URL: ${DATA_UPLOAD_URL:-}
      FUNDER_PID: ${FUNDER_PID:-CFID}
      # Flags for Standard ELMO (all form groups enabled)
      SHOW_MSL_MODE: ${SHOW_MSL_MODE:-false}
      SHOW_GGMS_PROPERTIES: ${SHOW_GGMS_PROPERTIES:-false}
      SHOW_USED_INSTRUMENTS: ${SHOW_USED_INSTRUMENTS:-true}
      SHOW_THESAURI: ${SHOW_THESAURI:-true}
      SHOW_FREE_KEYWORDS: ${SHOW_FREE_KEYWORDS:-true}
      SHOW_SPATIAL_TEMPORAL_COVERAGE: ${SHOW_SPATIAL_TEMPORAL_COVERAGE:-true}
      SHOW_RELATED_WORK: ${SHOW_RELATED_WORK:-true}
    depends_on:
      - db
    restart: unless-stopped
    networks:
      - internal
      - frontend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.elmo-router.rule=Host(`env.rz-vm499.gfz.de`) && PathPrefix(`/elmo`)"
      - "traefik.http.routers.elmo-router.entrypoints=https"
      - "traefik.http.routers.elmo-router.middlewares=elmo-stripprefix"
      - "traefik.http.middlewares.elmo-stripprefix.stripprefix.prefixes=/elmo"
      - "traefik.http.services.elmo-service.loadbalancer.server.port=80"
      - "traefik.docker.network=traefik"

  web-msl:
    build:
      context: .
      dockerfile: Dockerfile.legacy
    ports:
      - "8081:80"
    environment:
      DB_HOST: db
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}

      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_AUTH: ${SMTP_AUTH}
      SMTP_SECURE: ${SMTP_SECURE}
      SMTP_SENDER: ${SMTP_SENDER}
      FEEDBACK_ADDRESS: ${FEEDBACK_ADDRESS}
      XML_SUBMIT_ADDRESS: ${XML_SUBMIT_ADDRESS_MSL}
      SIMULATE_EMAIL: "false"
      TZ: Europe/Berlin
      ELMO_API_KEY: ${ELMO_API_KEY}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY}
      GOOGLE_MAPS_MAP_ID: ${GOOGLE_MAPS_MAP_ID:-}
      ERNIE_URL: ${ERNIE_URL}
      ERNIE_API_KEY: ${ERNIE_API_KEY}
      DATACITE_JSONLD_CONTEXT_URL: ${DATACITE_JSONLD_CONTEXT_URL}
      DATA_UPLOAD_URL: ${DATA_UPLOAD_URL:-}
      FUNDER_PID: ${FUNDER_PID:-CFID}
      # Flags for MSL (MSL-specific vocabularies enabled)
      SHOW_MSL_MODE: ${SHOW_MSL_MODE:-true}
      SHOW_GGMS_PROPERTIES: ${SHOW_GGMS_PROPERTIES_MSL:-false}
      SHOW_USED_INSTRUMENTS: ${SHOW_USED_INSTRUMENTS_MSL:-false}
      SHOW_THESAURI: ${SHOW_THESAURI_MSL:-true}
      SHOW_FREE_KEYWORDS: ${SHOW_FREE_KEYWORDS_MSL:-true}
      SHOW_SPATIAL_TEMPORAL_COVERAGE: ${SHOW_SPATIAL_TEMPORAL_COVERAGE_MSL:-true}
      SHOW_RELATED_WORK: ${SHOW_RELATED_WORK_MSL:-true}
      INSTANCE_TITLE: "ELMO MSL Edition – GFZ Metadata Editor 2.0"
    depends_on:
      - db
    restart: unless-stopped
    networks:
      - internal
      - frontend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.elmo-msl-router.rule=Host(`env.rz-vm499.gfz.de`) && PathPrefix(`/elmo-msl`)"
      - "traefik.http.routers.elmo-msl-router.entrypoints=https"
      - "traefik.http.routers.elmo-msl-router.middlewares=elmo-msl-stripprefix"
      - "traefik.http.middlewares.elmo-msl-stripprefix.stripprefix.prefixes=/elmo-msl"
      - "traefik.http.services.elmo-msl-service.loadbalancer.server.port=80"
      - "traefik.docker.network=traefik"

volumes:
  db_data:

networks:
  internal:
    driver: bridge
  frontend:
    external:
      name: traefik
