services:
  db:
    build:
      context: .
      dockerfile: Dockerfile.db
    pull_policy: build
    command:
      - mariadbd
      - --ddl-log=OFF
      - --skip-log-bin
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MARIADB_ROOT_PASSWORD: ${ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      TZ: Europe/Berlin
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  web-gem:
    build:
      context: .
      dockerfile: Dockerfile.web
      target: prod
    pull_policy: build
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      ROOT_PASSWORD: ${ROOT_PASSWORD}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_AUTH: ${SMTP_AUTH}
      SMTP_SECURE: ${SMTP_SECURE}
      SMTP_SENDER: ${SMTP_SENDER}
      FEEDBACK_ADDRESS: ${FEEDBACK_ADDRESS}
      XML_SUBMIT_ADDRESS: ${XML_SUBMIT_ADDRESS_GEM}
      SIMULATE_EMAIL: "false"
      TZ: Europe/Berlin
      ELMO_API_KEY: ${ELMO_API_KEY}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY}
      GOOGLE_MAPS_MAP_ID: ${GOOGLE_MAPS_MAP_ID:-}
      ERNIE_URL: ${ERNIE_URL}
      ERNIE_API_KEY: ${ERNIE_API_KEY}
      DATACITE_JSONLD_CONTEXT_URL: ${DATACITE_JSONLD_CONTEXT_URL}
      LOCAL_DEVELOPMENT: "false"
      DATA_UPLOAD_URL: ${DATA_UPLOAD_URL:-}
      FUNDER_PID: ${FUNDER_PID:-CFID}
      # Flags for ICGEM (GGMs properties enabled)
      SHOW_MSL_LABS: "false"
      SHOW_MSL_VOCABS: "false"
      SHOW_MSL_DEFAULT_FREE_KEYWORDS: "false"
      SHOW_MSL_LOGO: "false"
      SHOW_GGMS_PROPERTIES: "true"
      SHOW_USED_INSTRUMENTS: "false"
      SHOW_THESAURI: "true"
      SHOW_FREE_KEYWORDS: "true"
      SHOW_SPATIAL_TEMPORAL_COVERAGE: "false"
      SHOW_RELATED_WORK: "true"
      INSTANCE_TITLE: "ELMO for ICGEM"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    volumes:
      - xml_data:/var/www/html/xml
      - storage_data:/var/www/html/storage
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        memory: 512M

volumes:
  xml_data:
    driver: local
  storage_data:
    driver: local

networks:
  default:
    name: elmo-stage
    driver: bridge
