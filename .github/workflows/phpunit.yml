name: PHPUnit Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      test_badge_generation:
        description: 'Test badge generation (even on non-main branches)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_password
          MYSQL_DATABASE: mde2-msl-test
          MYSQL_USER: test_user
          MYSQL_PASSWORD: test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping --silent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, pdo_mysql, mysqli, zip
          coverage: xdebug

      - name: Determine Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-8.5-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-8.5-composer-
            ${{ runner.os }}-php-composer-

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install PHP dependencies
        run: |
          composer install --prefer-dist --no-progress --no-suggest
          composer dump-autoload -o

      - name: Validate composer.json and composer.lock
        run: composer validate --strict

      - name: Install JS dependencies
        run: npm ci

      - name: Wait for MySQL to be ready
        run: |
          for i in {30..0}; do
            if mysqladmin ping -h127.0.0.1 --silent; then
              break
            fi
            echo 'Waiting for MySQL...'
            sleep 5
          done
          if [ "$i" = 0 ]; then
            echo >&2 'MySQL did not start in time.'
            exit 1
          fi

      - name: Grant privileges to test_user
        run: |
          mysql -h127.0.0.1 -uroot -proot_password -e "
            CREATE USER IF NOT EXISTS 'test_user'@'%' IDENTIFIED BY 'test_password';
            GRANT ALL PRIVILEGES ON *.* TO 'test_user'@'%';
            FLUSH PRIVILEGES;
          "

      - name: Create settings.php
        run: |
          cat <<'PHP' > settings.php
          <?php
          function connectDb() {
              $host = '127.0.0.1';
              $username = 'test_user';
              $password = 'test_password';
              $database = 'mde2-msl-test';
              $conn = new mysqli($host, $username, $password, $database);
              return $conn;
          }

          function getApiKey() {
              $apiKeyGoogleMaps = 'test_api_key';
              echo json_encode(['apiKey' => $apiKeyGoogleMaps]);
          }

          if (basename(__FILE__) == basename($_SERVER['PHP_SELF'])) {
              if ($_SERVER['REQUEST_METHOD'] === 'GET') {
                  getApiKey();
              }
          }

          $connection = connectDb();

          $apiKeyElmo = '1234-1234-1234-1234';

          $apiKeyTimezone = 'test_timezone_api_key';
          $maxTitles = 2;
          $mslLabsUrl = 'https://raw.githubusercontent.com/UtrechtUniversity/msl_vocabularies/main/vocabularies/labs/labnames.json';

          $showFeedbackLink = true;
          $smtpHost = 'smtp.test.de';
          $smtpPort = 465;
          $smtpUser = 'test_user';
          $smtpPassword = 'test_password';
          $smtpSender = 'test_sender@test.com';
          $feedbackAddress = 'feedback@test.com';
          PHP

      - name: Initialize database structure and lookup data
        run: php -r "require 'install.php'; createDatabaseStructure(\$connection); insertLookupData(\$connection);"

      - name: Start PHP built-in web server
        run: |
          php -S localhost:8000 -t . tests/server.php 2>&1 > server.log &
          echo $! > server.pid
          sleep 10

          echo "Testing initial API endpoints:"
          curl -v http://localhost:8000/api/v2/general/alive
          echo "\nTesting licenses endpoint:"
          curl -v http://localhost:8000/api/v2/vocabs/licenses/all

          echo "\nInitial server log contents:"
          cat server.log
          echo "\nPHP error log:"
          if [ -f /var/log/php_errors.log ]; then
            cat /var/log/php_errors.log
          fi

      - name: Set PHPUnit permissions
        run: chmod +x vendor/bin/phpunit

      - name: Run PHPUnit tests
        env:
          API_BASE_URL: http://localhost:8000
        run: |
          vendor/bin/phpunit --configuration phpunit.xml --debug

          echo "\nFinal Server Log:"
          cat server.log

      - name: Generate coverage (PHP 8.5 push builds only)
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.test_badge_generation)
        env:
          API_BASE_URL: http://localhost:8000
          XDEBUG_MODE: coverage
        run: |
          echo "Checking Xdebug status:"
          php -m | grep -i xdebug || echo "Xdebug not found!"
          php -v
          vendor/bin/phpunit --configuration phpunit.xml --coverage-clover clover.xml
          echo "\nChecking clover.xml:"
          if [ -f clover.xml ]; then
            echo "clover.xml created successfully!"
            head -20 clover.xml
          else
            echo "ERROR: clover.xml was not created!"
          fi

      - name: Prepare output directory
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.test_badge_generation)
        run: |
          mkdir -p output
          touch output/.keep

      - name: Generate coverage badge from clover.xml
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.test_badge_generation)
        run: |
          if [ -f clover.xml ]; then
            echo "Parsing clover.xml for coverage data..."
            # Extract coverage metrics from clover.xml
            STATEMENTS=$(grep -oP 'statements="\K[0-9]+' clover.xml | head -1)
            COVERED=$(grep -oP 'coveredstatements="\K[0-9]+' clover.xml | head -1)
            
            if [ -n "$STATEMENTS" ] && [ "$STATEMENTS" -gt 0 ]; then
              COVERAGE=$(echo "scale=1; $COVERED * 100 / $STATEMENTS" | bc)
              echo "Coverage: $COVERAGE% ($COVERED/$STATEMENTS statements)"
            else
              echo "Could not parse coverage from clover.xml, trying alternative method..."
              # Alternative: use PHP to parse XML
              COVERAGE=$(php -r "
                \$xml = simplexml_load_file('clover.xml');
                \$metrics = \$xml->xpath('//metrics');
                \$statements = 0;
                \$covered = 0;
                foreach (\$metrics as \$m) {
                  \$statements += (int)\$m['statements'];
                  \$covered += (int)\$m['coveredstatements'];
                }
                echo \$statements > 0 ? round(\$covered / \$statements * 100, 1) : 0;
              ")
              echo "Coverage (PHP parsed): $COVERAGE%"
            fi
            
            # Determine badge color
            if [ $(echo "$COVERAGE >= 90" | bc -l) -eq 1 ]; then
              COLOR="brightgreen"
            elif [ $(echo "$COVERAGE >= 75" | bc -l) -eq 1 ]; then
              COLOR="green"
            elif [ $(echo "$COVERAGE >= 60" | bc -l) -eq 1 ]; then
              COLOR="yellow"
            elif [ $(echo "$COVERAGE >= 45" | bc -l) -eq 1 ]; then
              COLOR="orange"
            else
              COLOR="red"
            fi
            
            echo "Badge color: $COLOR"
            
            # Download badge from shields.io
            curl -s "https://img.shields.io/badge/coverage-${COVERAGE}%25-${COLOR}.svg" > output/coverage.svg
            echo "Badge created successfully!"
            cat output/coverage.svg | head -5
          else
            echo "ERROR: clover.xml not found!"
            # Create error badge
            curl -s "https://img.shields.io/badge/coverage-no%20data-red.svg" > output/coverage.svg
          fi

      - name: Debug badge creation
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.test_badge_generation)
        run: |
          echo "Checking output directory contents:"
          ls -la output/
          if [ -f output/coverage.svg ]; then
            echo "Coverage badge created successfully!"
            echo "Badge file size:"
            wc -c output/coverage.svg
          else
            echo "Coverage badge NOT created!"
          fi

      - name: Publish coverage badge
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.test_badge_generation)
        continue-on-error: true
        uses: peaceiris/actions-gh-pages@v4
        with:
          publish_dir: ./output
          publish_branch: image-data
          github_token: ${{ secrets.GITHUB_TOKEN }}
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          keep_files: false
          force_orphan: true

      - name: Stop PHP server
        if: always()
        run: |
          if [ -f server.pid ]; then
            kill "$(cat server.pid)"
          else
            echo "server.pid not found; PHP server was likely not started."
          fi
