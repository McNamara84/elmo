<div class="card mb-2">
  <div class="card-header">
    <b data-translate="dataSources.title">Data Sources</b>
    <i class="bi bi-question-circle-fill" data-help-section-id="help-datasources-fg" aria-hidden="true"></i>
  </div>
  <div class="card-body">
    <!-- Main container for data sources -->
    <div id="group-datasources" class="d-grid gap-2">
      <div class="row g-1 mx-0 border rounded p-1 bg-body" data-source-row>
        <!-- Data Source Type (Dropdown) -->
        <div class="col-6 col-md-3 p-1 visibility-datasources-basic">
          <div class="input-group has-validation">
            <div class="form-floating">
              <select class="form-select input-with-help"
                id="input-datasource-type" name="datasource_type[]" >
                <!-- Satellite will be the default value -->
                <option value="S" selected>Satellite</option>
                <option value="G">Ground data</option>
                <option value="A">Altimetry</option>
                <option value="M">Reference Model</option>
                <option value="T">Elevation/Terrain</option>
              </select>
              <label for="input-datasource-type" data-translate="dataSources.type">Type<span
                  class="text-danger">*</span></label>
              <div class="invalid-feedback" data-translate="general.pleaseChoose">Please choose</div>
            </div>
            <div class="input-group-append">
              <span class="input-group-text"><i class="bi bi-question-circle-fill"
                  data-help-section-id="help-datasource-type" aria-hidden="true"></i></span>
            </div>
          </div>
        </div>
        <!-- Description (free text) -->
        <div class="col-6 col-md-3 p-1 visibility-datasources-basic">
          <div class="input-group">
            <div class="form-floating">
              <textarea class="form-control"
                id="input-datasource-description" name="datasource_description[]" rows="1"></textarea>
              <label for="input-datasource-description" data-translate="dataSources.description">Description</label>
            </div>
          </div>
        </div>
        <!-- Details (Dropdown) -->
        <div class="col-11 col-md-5 p-1 visibility-datasources-details">
          <div class="input-group has-validation">
            <div class="form-floating">
              <select class="form-select input-with-help input-right-no-round-corners"
                aria-label="Default select example" id="input-datasource-details" name="datasource_details[]">
                <option disabled selected hidden value="">Select type first</option>
              </select>
              <label for="input-datasource-details" data-translate="dataSources.details">Details<span
                  class="text-danger">*</span></label>
              <div class="invalid-feedback" data-translate="general.pleaseChoose">Please choose</div>
            </div>
            <div class="input-group-append">
              <span class="input-group-text"><i class="bi bi-question-circle-fill"
                  data-help-section-id="help-datasource-details" aria-hidden="true"></i></span>
            </div>
          </div>
        </div>
        <!-- Isostasy-specific Section -->
        <div class="col-11 col-lg-3 p-1 visibility-datasources-compensation">
          <div class="input-group">
            <div class="form-floating">
              <input type="number" class="form-control" id="input-datasource-compensationdepth" name="compensation_depth[]" />
              <label for="input-datasource-compensationdepth" data-translate="dataSources.compensationDepth">Compensation depth (in meters)</label>
            </div>
          </div>
        </div>
        <!-- Model-specific Section -->
        <!-- Model Name (Text Input)-->
        <div class="col-12 col-md-4 p-1 visibility-datasources-identifier">
          <div class="input-group has-validation">
            <div class="form-floating">
              <input type="text" class="form-control" id="input-datasource-modelname" name="dName[]" />
              <label for="input-datasource-modelname" data-translate="dataSources.modelName">Model name</label>
              <div class="invalid-feedback" data-translate="dataSources.modelNameInvalid">
                Provide the name of the model here
              </div>
            </div>
          </div>
        </div>
        <!-- Identifier (Text Input)-->
        <div class="col-12 col-sm-6 col-md-4 p-1 visibility-datasources-identifier">
          <div class="input-group has-validation">
            <div class="form-floating">
              <input type="text" class="form-control input-with-help input-right-no-round-corners"
                name="dIdentifier[]" id="input-datasource-identifier"/>
              <label for="input-datasource-identifier" data-translate="dataSources.identifier">Identifier</label>
              <div class="invalid-feedback" data-translate="dataSources.identifierInvalid">Please enter a valid
                identifier.</div>
            </div>
            <div class="input-group-append">
              <span class="input-group-text"><i class="bi bi-question-circle-fill"
                  data-help-section-id="help-datasources-identifier" aria-hidden="true"></i></span>
            </div>
          </div>
        </div>
        <!-- Identifier Type (Dropdown)-->
        <div class="col-11 col-sm-5 col-md-3 p-1 visibility-datasources-identifier">
          <div class="input-group has-validation">
            <div class="form-floating">
              <select class="form-select input-with-help input-right-no-round-corners"
                id="input-datasource-identifiertype" name="dIdentifierType[]">
              </select>
              <label for="input-datasource-identifiertype"
                data-translate="dataSources.identifierType">Identifier type</label>
              <div class="invalid-feedback" data-translate="general.pleaseChoose">Please choose</div>
            </div>
            <div class="input-group-append">
              <span class="input-group-text"><i class="bi bi-question-circle-fill"
                  data-help-section-id="help-datasources-identifiertype" aria-hidden="true"></i></span>
            </div>
          </div>
        </div>
        <!-- Satellite-specific Section -->
        <div class="col-11 col-md-5 p-1 visibility-datasources-satellite">
          <div class="input-group has-validation">
            <div class="form-floating">
              <div class="input-group has-validation">
                <input type="text" class="form-control input-with-help input-right-no-round-corners"
                  id="input-datasource-platforms" name="satellite_platform[]" aria-label="GCMD Platforms keywords"/>
                <span class="input-group-text"><i class="bi bi-question-circle-fill"
                    data-help-section-id="help-gcmd-platforms-keyword" aria-hidden="true"></i></span>
              </div>
            </div>
            <div class="col-auto p-2">
              <button type="button" class="btn btn-primary" data-bs-toggle="modal" aria-label="Open-search-modal"
                data-bs-target="#modal-platforms-datasource" id="button-datasource-platforms" aria-hidden="true">
                <i class="bi bi-diagram-3" aria-hidden="true"></i>
              </button>
            </div>
          </div>
        </div>
        <!-- Remove Button (always the last column of the entry) -->
        <div class="col-1 p-0 d-flex justify-content-center align-items-center">
          <button type="button" class="btn btn-danger btn-sm px-2 removeButton"
            data-translate-title="dataSources.removeEntry" title="Remove data source" aria-label="Remove data source">
            <i class="bi bi-dash-lg" aria-hidden="true"></i>
          </button>
        </div>
      </div>
    </div>
    <button type="button" class="btn btn-primary addDataSource add-button d-inline-flex align-items-left gap-1 mt-2"
      id="button-datasource-add" data-translate-title="dataSources.addEntry" title="Add data source"
      aria-label="Add data source">
      <i class="bi bi-plus-lg" aria-hidden="true"></i>
      <span data-translate="dataSources.addEntry">Add data source</span>
    </button>
  </div>
</div>

<!-- Modal for GCMD PLATFORMS (specific to Data Sources) -->
<div class="modal fade" id="modal-platforms-datasource" tabindex="-1" aria-labelledby="label-platforms-datasource-modal"
  aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="label-platforms-datasource-modal" data-translate="keywords.Platforms">
          GCMD Platforms
        </h5>
        <span class="input-group-text"><i class="bi bi-question-circle-fill"
            data-help-section-id="help-keywords-keywordviewer" aria-hidden="true"></i></span>
      </div>
      <div class="modal-body d-flex">
        <!-- Left Side: Keyword Selection Tree -->
        <div class="w-50 pe-3 border-end">
          <label for="input-platforms-thesaurussearch-ds" class="visually-hidden">Search for keywords</label>
          <input type="text" class="form-control mb-3" id="input-platforms-thesaurussearch-ds"
            placeholder="Search for keywords..." data-translate="keywords.searchPlaceholder"
            aria-label="Search for keywords">
          <div id="jstree-platforms-datasource"></div>
        </div>
        <!-- Right Side: Selected Keywords -->
        <div class="w-50 ps-3">
          <h6 data-translate="keywords.selectedKeywords">Selected Keywords</h6>
          <ul id="selected-keywords-platforms-ds" class="list-group">
            <!-- Selected keywords will appear here dynamically -->
          </ul>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-primary" data-bs-dismiss="modal" aria-hidden="true">OK</button>
      </div>
    </div>
  </div>
</div>
