        if: always()
        with:
          name: playwright-report-nightly-${{ matrix.profile }}-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 14

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-nightly-${{ matrix.profile }}-${{ matrix.browser }}
          path: test-results/
          retention-days: 14

      - name: Display server logs on failure
        if: failure()
        run: |
          echo "=== Server Log ==="
          cat server.log

      - name: Stop PHP server
        if: always()
        run: |
          if [ -f server.pid ]; then
            kill "$(cat server.pid)" || true
          fi
