      summary: Look up DOI metadata from DataCite
      description: |-
        Queries the DataCite REST API for the given DOI and returns the metadata attributes
        relevant for ELMO form pre-filling. Acts as a server-side proxy to avoid CORS issues.
        Returns a filtered subset of DataCite attributes (titles, creators, contributors, etc.).
      operationId: doiLookup
      parameters:
        - name: doi
          in: path
          required: true
          schema:
            type: string
          description: The full DOI string (e.g. "10.14454/qdd3-ps68")
          example: "10.14454/qdd3-ps68"
      responses:
        "200":
          description: DOI lookup result
          content:
            application/json:
              schema:
                type: object
                properties:
                  found:
                    type: boolean
                    description: Whether the DOI was found on DataCite
                  attributes:
                    type: object
                    description: Filtered DataCite metadata attributes (only present when found is true)
                    properties:
                      doi:
                        type: string
                        example: "10.14454/qdd3-ps68"
                      titles:
                        type: array
                        items:
                          type: object
                          properties:
                            title:
                              type: string
                            titleType:
                              type: string
                              nullable: true
                      creators:
                        type: array
                        items:
                          type: object
                          properties:
                            name:
                              type: string
                            givenName:
                              type: string
                            familyName:
                              type: string
                            nameType:
                              type: string
                            nameIdentifiers:
                              type: array
                              items:
                                type: object
                            affiliation:
                              type: array
                              items:
                                type: object
                      publicationYear:
                        type: integer
                        example: 2023
                      types:
                        type: object
                        properties:
                          resourceTypeGeneral:
                            type: string
                      language:
                        type: string
                        example: "en"
                      version:
                        type: string
                        nullable: true
                required:
                  - found
        "400":
          description: Invalid DOI format
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: DataCite API unreachable or returned an error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /doi/contacts:
    get:
      tags:
        - doi
      security: []
      summary: Look up contact person data by ORCID or name
      description: |-
        Searches the local Contact_Person table for email and website by ORCID (preferred)
        or by family name and given name (fallback). Returns null values when no match is found.
        This is a best-effort lookup since DataCite does not store contact details.
      operationId: doiContacts
      parameters:
        - name: orcid
          in: query
          required: false
          schema:
            type: string
          description: ORCID identifier of the contact person
          example: "0000-0002-1825-0097"
        - name: familyname
          in: query
          required: false
          schema:
            type: string
          description: Family name for name-based lookup
          example: "Doe"
        - name: givenname
          in: query
          required: false
          schema:
            type: string
          description: Given name for name-based lookup
          example: "Jane"
      responses:
        "200":
          description: Contact person lookup result
          content:
            application/json:
              schema:
                type: object
                properties:
                  email:
                    type: string
                    nullable: true
                    description: Email address if found, null otherwise
                    example: "jane.doe@example.org"
                  website:
                    type: string
                    nullable: true
                    description: Website URL if found, null otherwise
                    example: "https://example.org/~jdoe"
                required:
                  - email
                  - website
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key to access protected endpoints. Required for all /update/ endpoints.
  schemas:
    License:
      type: object
      properties:
        rights_id:
          type: integer
          format: int64
          description: Unique identifier for the license
          example: 1
        name:
          type: string
          description: Full name of the license
          example: "Creative Commons Attribution 4.0 International"
        url:
          type: string
          format: uri
          description: URL to the license text
          example: "https://creativecommons.org/licenses/by/4.0/"
        forSoftware:
          type: integer
          enum: [0, 1]
          default: 0
          description: Indicates if license is suitable for software (1) or not (0)
      required:
        - rights_id
        - name
        - url
    SoftwareLicense:
      type: object
      properties:
        rights_id:
          type: integer
          format: int64
          description: Unique identifier for the software license
          example: 2
        name:
          type: string
          description: Full name of the software license
          example: "MIT License"
        url:
          type: string
          format: uri
          description: URL to the license text
          example: "https://opensource.org/licenses/MIT"
        forSoftware:
          type: integer
          enum: [1]
          default: 1
          description: Always 1 for software licenses
      required:
        - rights_id
        - name
        - url
        - forSoftware
    DraftRequest:
      type: object
      description: Request body for creating or updating an autosave draft.
      properties:
        payload:
          type: object
          description: Autosaved form data captured from the metadata editor.
          additionalProperties: true
      required:
        - payload
    DraftMetadata:
      type: object
      description: Metadata describing a persisted autosave draft.
      properties:
        id:
          type: string
          description: Unique identifier of the draft
          example: "4f2c1a7e2b7c4d9e8f6a1b0c2d3e4f5a"
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the draft was last updated (UTC, microsecond precision)
          example: "2024-05-18T12:34:56.123456Z"
        checksum:
          type: string
          description: SHA-256 checksum of the stored payload
          example: "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"
      required:
        - id
        - updatedAt
        - checksum
    DraftRecord:
      allOf:
        - $ref: "#/components/schemas/DraftMetadata"
        - type: object
          properties:
            payload:
              type: object
              description: Autosaved form data previously submitted by the user.
              additionalProperties: true
          required:
            - payload
    TimezonesUpdateResponse:
      type: object
      properties:
        message:
          type: string
          description: Status message of the update operation
          example: "Timezones successfully updated"
        timezones:
          type: array
          description: List of updated timezones
          items:
            $ref: "#/components/schemas/Timezone"
      required:
        - message
        - timezones
    Timezone:
      type: object
      properties:
        value:
          type: string
          description: The timezone identifier
          example: "Europe/Berlin"
        label:
          type: string
          description: The formatted timezone label
          example: "UTC+02:00 (Europe/Berlin)"
      required:
        - value
        - label
    VocabularyUpdate:
      type: object
      properties:
        message:
          type: string
          description: Status message of the update operation
          example: "Successfully updated MSL vocabularies"
        version:
          type: string
          description: Version of the updated vocabulary
          example: "1.3"
        timestamp:
          type: string
          format: date-time
          description: Time of the update
          example: "2024-11-16T20:30:22Z"
      required:
        - message
        - version
        - timestamp
    RelationsResponse:
      type: object
      properties:
        relations:
          type: array
          description: List of available relations
          items:
            $ref: "#/components/schemas/Relation"
      required:
        - relations
    Relation:
      type: object
      properties:
        id:
          type: integer
          description: Unique identifier of the relation
          example: 1
        name:
          type: string
          maxLength: 45
          description: Name of the relation
          example: "IsCitedBy"
        description:
          type: string
          maxLength: 1000
          description: Description of the relation
          example: "Indicates that B cites A"
      required:
        - id
        - name
        - description
    MSLLabsUpdateResponse:
      type: object
      properties:
        message:
          type: string
          description: Status message of the update operation
          example: "MSL Labs vocabulary successfully updated"
        labs:
          type: array
          description: List of updated labs
          items:
            $ref: "#/components/schemas/MSLLab"
      required:
        - message
        - labs
    MSLLab:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the lab
          example: "lab1"
        name:
          type: string
          description: Name of the laboratory
          example: "Laboratory A"
        affiliation:
          type: string
          description: Affiliation of the laboratory
          example: "University X"
      required:
        - id
        - name
        - affiliation
    RorAffiliation:
      type: object
      properties:
        id:
          type: string
          description: ROR identifier of the affiliation
          example: "https://ror.org/012m9bp23"
        name:
          type: string
          description: Preferred name of the affiliation
          example: "University of Applied Sciences Potsdam"
        other:
          type: array
          description: Alternative names (aliases, labels, acronyms)
          items:
            type: string
          example:
            - "FH Potsdam"
            - "Fachhochschule Potsdam University of Applied Sciences"
            - "Fachhochschule Potsdam"
            - "FHP"
      required:
        - id
        - name
        - other
    Error:
      type: object
      properties:
        error:
          type: string
          description: Error message
          example: "An error occurred"
      required:
        - error
    GcmdVocabularyUpdate:
      type: object
      properties:
        message:
          type: string
          description: Status message of the update operation
          example: "GCMD vocabularies update completed"
        results:
          type: object
          description: Results for each vocabulary type
          properties:
            instruments:
              type: string
              example: "Updated successfully"
            sciencekeywords:
              type: string
              example: "Updated successfully"
            platforms:
              type: string
              example: "Updated successfully"
        timestamp:
          type: string
          format: date-time
          description: Time of the update
          example: "2024-11-17T10:51:38Z"
      required:
        - message
        - results
        - timestamp
    HealthResponse:
      type: object
      properties:
        message:
          type: string
          description: Health status message
          example: "I'm still alive..."
      required:
        - message
    VocabularyTree:
      type: array
      description: Hierarchical structure of vocabulary terms
      items:
        $ref: "#/components/schemas/VocabularyNode"
    VocabularyNode:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the term
        text:
          type: string
          description: Display text of the term
        language:
          type: string
          description: Language code of the term
        scheme:
          type: string
          description: Name of the vocabulary scheme
        schemeURI:
          type: string
          format: uri
          description: URI of the vocabulary scheme
        description:
          type: string
          description: Description or synonyms (comma-separated)
        children:
          type: array
          description: Child terms in the hierarchy
          items:
            $ref: "#/components/schemas/VocabularyNode"
      required:
        - id
        - text
        - language
        - scheme
        - schemeURI
        - description
        - children
    Role:
      type: object
      description: |
        When served from ERNIE (default), only `name` and `forInstitutions` are returned.
        When falling back to the local database, additional fields like `role_id` and `ernie_id` may be present.
      properties:
        name:
          type: string
          description: Name of the role
          example: "Data Curator"
        forInstitutions:
          type: integer
          description: |
            Role type indicator:
            * `0` - for persons only
            * `1` - for institutions only
            * `2` - for both persons and institutions
          enum: [0, 1, 2]
          example: 0
        role_id:
          type: integer
          description: Local database identifier (only present in DB fallback responses)
          example: 1
        ernie_id:
          type: integer
          nullable: true
          description: ERNIE API identifier (only present in DB fallback responses)
          example: 5
      required:
        - name
        - forInstitutions
    FreeKeywordsResponse:
      type: array
      description: List of free keywords
      items:
        type: object
        properties:
          free_keyword:
            type: string
            description: The keyword text
            example: "carbon dioxide emission"
        required:
          - free_keyword
    PatternResponse:
      type: object
      properties:
        pattern:
          type: string
          description: Regular expression pattern for validation
          example: "^[a-zA-Z0-9]{10}$"
      required:
        - pattern
    IdentifierTypesResponse:
      type: object
      properties:
        identifierTypes:
          type: array
          description: List of identifier types
          items:
            $ref: "#/components/schemas/IdentifierType"
      required:
        - identifierTypes
    IdentifierType:
      type: object
      properties:
        name:
          type: string
          description: Name of the identifier type
          example: "DOI"
        pattern:
          type: string
          description: Regular expression pattern for validation
          example: "^10\\.\\d{4,9}/[-._;()/:A-Z0-9]+$"
        description:
          type: string
          description: Description of the identifier type
          example: "Digital Object Identifier"
      required:
        - name
        - pattern
        - description
    ResourceType:
      type: object
      properties:
        id:
          type: integer
          description: Unique identifier of the resource type
          example: 5
        resource_type_general:
          type: string
          description: General name of the resource type
          example: Dataset
        description:
          type: string
          description: Description of the resource type
          example: Data encoded in a defined structure.
      required:
        - id
        - resource_type_general
    Language:
      type: object
      properties:
        id:
          type: integer
          description: Unique identifier of the language
          example: 1
        code:
          type: string
          description: ISO 639-1 code of the language
          example: en
        name:
          type: string
          description: Name of the language
          example: English
      required:
        - id
        - code
        - name
    TitleType:
      type: object
      properties:
        id:
          type: integer
          description: Unique identifier of the title type (local database ID)
          example: 1
        name:
          type: string
          description: Name of the title type
          example: "Main Title"
      required:
        - id
        - name
    DescriptionType:
      type: object
      properties:
        id:
          type: integer
          description: Unique identifier of the description type (ERNIE ID)
          example: 1
        name:
          type: string
          description: Display name of the description type
          example: "Abstract"
        slug:
          type: string
          description: URL-friendly identifier used as form field key
          example: "Abstract"
      required:
        - id
        - name
        - slug
    Pid4instInstrument:
      type: object
      description: A scientific instrument from the PID4INST catalogue
      properties:
        pid:
          type: string
          description: Persistent identifier (Handle) of the instrument
          example: "21.11157/a9250866-bbec-4542-86b3-a5f78c0c6922"
        pidType:
          type: string
          description: Type of the persistent identifier
          example: "Handle"
        name:
          type: string
          description: Name of the instrument
          example: "MFC_001000_02"
        instrumentTypes:
          type: array
          description: List of instrument type classifications
          items:
            type: string
          example: ["Mass flow controller"]
      required:
        - pid
        - pidType
        - name
        - instrumentTypes