name: Production Release Signal

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  signal:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # No checkout and no execution of release-tag code. The promotion verifies
      # this workflow's exact bytes at the signal SHA before reading its data.
      - name: Record the original publication event
        shell: bash
        run: |
          set -euo pipefail
          jq '{schema: 1, action, repository: .repository.full_name,
            repository_id: .repository.id, release: {id: .release.id,
              tag: .release.tag_name, draft: .release.draft,
              prerelease: .release.prerelease, published_at: .release.published_at},
            sha: env.GITHUB_SHA, ref: env.GITHUB_REF,
            run_id: (env.GITHUB_RUN_ID | tonumber),
            run_attempt: (env.GITHUB_RUN_ATTEMPT | tonumber)}' \
            "$GITHUB_EVENT_PATH" > "$RUNNER_TEMP/release-signal.json"
      - name: Preserve the signal for trusted promotion and retries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-release-signal-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-signal.json
          if-no-files-found: error
          retention-days: 90
