openapi: 3.1.1
info:
  title: ELMO - Enhanced Linked Metadata Organizer
  description: |-
    This is the ELMO API V2 from GFZ Data Services. The API allows management and retrieval of metadata for scientific datasets.

    Some useful links:
    - [The ELMO repository](https://github.com/McNamara84/elmo)
    - [Test Server](https://env.rz-vm182.gfz.de/elmo)
    - [Legal notice](https://dataservices-cms.gfz.de/about-us/legal-notice)

    ### Authentication
    All `/update/` endpoints require authentication using an API key. Contact the administrator to obtain an API key.

    ### Binary Data
    Some endpoints return downloadable XML or JSON-LD files. These responses use `application/xml`
    or `application/ld+json` depending on the selected export scheme.

    ### Rate Limiting
    Rate limiting may apply to prevent abuse.
  termsOfService: https://github.com/McNamara84/elmo
  contact:
    name: Holger Ehrmann
    email: ehrmann@gfz.de
    url: https://env.rz-vm182.gfz.de/elmo
  license:
    name: GPL-2.0-only
    url: https://raw.githubusercontent.com/McNamara84/elmo/refs/heads/main/LICENSE.md
  version: 2.0.1
externalDocs:
  description: Documentation of the API V1 at GitHub
  url: https://github.com/McNamara84/elmo#api-endpunkte
servers:
  - url: https://env.rz-vm182.gfz.de/elmo/api/v2
    description: Test server
security:
  - []
  - ApiKeyAuth: []
tags:
  - name: general
    description: General operations for health checks and version
  - name: update
    description: Operations for updating the vocabularies
  - name: vocabularies
    description: Operations for retrieving vocabularies
  - name: validation
    description: Operations for data validation
  - name: dataset
    description: Operations for dataset management and export
  - name: drafts
    description: Operations for managing autosave drafts within a user session
  - name: admin
    description: Administrative operations for cache management (requires API key)
  - name: doi
    description: DOI lookup operations via the DataCite REST API
paths:
  /update/timezones:
    get:
      tags:
        - update
      summary: Update timezones
      description: Fetches the latest timezones from TimeZoneDB API and updates the local JSON file.
      operationId: updateTimezones
      responses:
        "200":
          description: Timezones successfully updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimezonesUpdateResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized - Invalid or missing API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /update/ror:
    get:
      tags:
        - update
      summary: Update ROR affiliations
      description: |-
        Updates the ROR (Research Organization Registry) affiliations and stores them in `json/affiliations.json` for autocomplete functionality. Each entry in the generated file contains the ROR identifier (`id`), the preferred affiliation name (`name`), and an array of alternative names (`other`) including aliases, labels without language codes, and acronyms.
      operationId: getRorAffiliations
      responses:
        "200":
          description: ROR affiliations successfully updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: Success message
                    example: "ROR affiliations successfully updated"
                  count:
                    type: integer
                    description: Number of affiliations processed
                    example: 111808
                  timestamp:
                    type: string
                    format: date-time
                    description: Time of update
                    example: "2025-01-15T14:30:00Z"
                required:
                  - message
                  - count
                  - timestamp
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized - Invalid or missing API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /update/vocabs/msl:
    get:
      tags:
        - update
      summary: Update MSL vocabularies
      description: |-
        Updates all MSL vocabularies (materials, porefluids, and rockphysics) from the source repository. 
        Synonyms from the source are stored as comma-separated strings in the description field.
      operationId: getMslVocab
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VocabularyUpdate"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized - Invalid or missing API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /update/vocabs/msl/labs:
    get:
      tags:
        - update
      summary: Update MSL Labs vocabulary
      description: Fetch and update the MSL Labs vocabulary from the GitHub repository.
      operationId: updateMslLabs
      responses:
        "200":
          description: MSL Labs vocabulary successfully updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MSLLabsUpdateResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized - Invalid or missing API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /update/vocabs/gcmd:
    get:
      tags:
        - update
      summary: Update GCMD vocabularies (Science Keywords, Instruments, and Platforms)
      description: Updates all GCMD vocabularies (Science Keywords, Instruments, and Platforms) from NASA's GCMD repository
      operationId: updateGcmdVocabs
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GcmdVocabularyUpdate"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized - Invalid or missing API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /update/vocabs/cgi:
    get:
      tags:
        - update
      summary: Update CGI Simple Lithology keywords
      description: Fetches the latest CGI Simple Lithology vocabulary and stores it as JSON.
      operationId: updateCGIKeywords
      responses:
        "200":
          description: CGI keywords successfully updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "CGI keywords successfully updated"
                  timestamp:
                    type: string
                    format: date-time
                    example: "2025-01-19T08:45:22Z"
                required:
                  - message
                  - timestamp
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized - Invalid or missing API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /update/crossref:
    get:
      tags:
        - update
      summary: Update CrossRef funders
      description: |-
        Updates the CrossRef funders list by:
        1. Fetching all funders from the CrossRef API using pagination
        2. Processing and storing the data for dropdown selection
        3. Saving them as JSON for dropdown functionality

        Important: Uses polite rate limiting and includes proper user agent headers
        as required by CrossRef's API etiquette.
      operationId: getCrossref
      responses:
        "200":
          description: CrossRef funders successfully updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: Success message
                    example: "CrossRef funders successfully updated"
                  count:
                    type: integer
                    description: Number of funders processed
                    example: 27391
                  timestamp:
                    type: string
                    format: date-time
                    description: Time of update
                    example: "2025-01-19T08:45:22Z"
                required:
                  - message
                  - count
                  - timestamp
        "429":
          description: Too many requests - rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized - Invalid or missing API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /general/alive:
    get:
      tags:
        - general
      security: []
      summary: Health check
      description: Check if the API is responsive
      operationId: getAlive
      responses:
        "200":
          description: API is responsive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /vocabs/sciencekeywords:
    get:
      tags:
        - vocabularies
      security: []
      summary: Get GCMD Science Keywords (for third party use)
      description: Retrieve the controlled vocabulary of GCMD Science Keywords from NASA (already prepared for use with jsTree)
      operationId: getGcmdScienceKeywords
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VocabularyTree"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /vocabs/cgi:
    get:
      tags:
        - vocabularies
      security: []
      summary: Get CGI Simple Lithology keywords
      description: Retrieve the CGI Simple Lithology vocabulary already prepared for use with jsTree
      operationId: getCGIKeywords
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VocabularyTree"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /vocabs/freekeywords/all:
    get:
      tags:
        - vocabularies
      security: []
      summary: Get all free keywords
      description: Returns all free keywords from the database, regardless of curation status
      operationId: getAllFreeKeywords
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FreeKeywordsResponse"
        "404":
          description: No keywords found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /vocabs/freekeywords/curated:
    get:
      tags:
        - vocabularies
      security: []
      summary: Get curated free keywords
      description: Returns only curated free keywords from the database
      operationId: getCuratedFreeKeywords
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FreeKeywordsResponse"
        "404":
          description: No curated keywords found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /vocabs/freekeywords/uncurated:
    get:
      tags:
        - vocabularies
      security: []
      summary: Get uncurated free keywords
      description: Returns only uncurated free keywords from the database
      operationId: getUncuratedFreeKeywords
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FreeKeywordsResponse"
        "404":
          description: No uncurated keywords found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /vocabs/roles:
    get:
      tags:
        - vocabularies
      security: []
      summary: Retrieve roles based on type
      description: |
        Get a list of roles filtered by type. When ERNIE is configured, roles are fetched
        from the ERNIE API (with caching) and synced to the local database. Falls back to
        the local database if ERNIE is unavailable.
      operationId: getRoles
      parameters:
        - name: type
          in: query
          description: Type of roles to retrieve
          schema:
            type: string
            enum: [all, person, institution, both]
            default: all
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Role"
        "400":
          description: Invalid role type provided
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /vocabs/relations:
    get:
      tags:
        - vocabularies
      security: []
      summary: Get all relations
      description: Retrieve all available relations for dataset relationships
      operationId: getRelations
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RelationsResponse"
        "404":
          description: No relations found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /vocabs/licenses/all:
    get:
      tags:
        - vocabularies
      security: []
      summary: Get all licenses
      description: Returns all available licenses
      operationId: getAllLicenses
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/License"
        "404":
          description: No licenses found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /vocabs/licenses/software:
    get:
      tags:
        - vocabularies
      security: []
      summary: Get software licenses
      description: Returns licenses specifically for software
      operationId: getSoftwareLicenses
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SoftwareLicense"
        "404":
          description: No software licenses found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /vocabs/pid4inst/instruments:
    get:
      tags:
        - vocabularies
      security: []
      summary: Get PID4INST instruments
      description: Retrieve instruments from the PID4INST catalogue (via ERNIE API with caching). Returns a simplified list with only the fields needed by the frontend.
      operationId: getPid4instInstruments
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Pid4instInstrument"
        "503":
          description: Instrument data temporarily unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/cache/pid4inst/refresh:
    post:
      tags:
        - update
      summary: Refresh PID4INST instruments cache
      description: Forces a refresh of the cached PID4INST instrument data from the ERNIE API. Requires API key authentication.
      operationId: refreshPid4instCache
      parameters:
        - name: X-API-KEY
          in: header
          required: true
          schema:
            type: string
          description: API key for authentication
      responses:
        "200":
          description: Cache refreshed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "PID4INST instruments cache refreshed successfully."
        "401":
          description: Unauthorized - Invalid or missing API key
        "500":
          description: Failed to refresh cache
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/cache/pid4inst/status:
    get:
      tags:
        - update
      summary: Get PID4INST cache status
      description: Returns the current status of the PID4INST instruments cache including validity, age, and entry count. Requires API key authentication.
      operationId: getPid4instCacheStatus
      parameters:
        - name: X-API-KEY
          in: header
          required: true
          schema:
            type: string
          description: API key for authentication
      responses:
        "200":
          description: Cache status retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  exists:
                    type: boolean
                  valid:
                    type: boolean
                  age_seconds:
                    type: integer
                    nullable: true
                  ttl_seconds:
                    type: integer
                  entry_count:
                    type: integer
                    nullable: true
        "401":
          description: Unauthorized - Invalid or missing API key
  /vocabs/resourcetypes:
    get:
      tags:
        - vocabularies
      security: []
      summary: Get resource types
      description: Retrieve all available DataCite resource types
      operationId: getResourceTypes
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ResourceType"
        "404":
          description: No resource types found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /vocabs/languages:
    get:
      tags:
        - vocabularies
      security: []
      summary: Get languages
      description: Retrieve all available languages
      operationId: getLanguages
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Language"
        "404":
          description: No languages found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /vocabs/titletypes:
    get:
      tags:
        - vocabularies
      security: []
      summary: Get title types
      description: Retrieve all available title types. When ERNIE is configured, types are fetched from ERNIE with caching and synced to the local database. Falls back to the local database if ERNIE is unavailable.
      operationId: getTitleTypes
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TitleType"
        "404":
          description: No title types found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /vocabs/descriptiontypes:
    get:
      tags:
        - vocabularies
      security: []
      summary: Get description types
      description: Retrieve all available description types. When ERNIE is configured, types are fetched from ERNIE with caching. Falls back to hardcoded types (Abstract, Methods, TechnicalInfo, Other) if ERNIE is unavailable.
      operationId: getDescriptionTypes
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DescriptionType"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /validation/patterns/{type}:
    get:
      tags:
        - validation
      security: []
      summary: Retrieve regex pattern for validation
      description: Returns the regex pattern for validating the specified type
      operationId: getPattern
      parameters:
        - name: type
          in: path
          required: true
          schema:
            type: string
          description: The type for which to retrieve the validation pattern
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatternResponse"
        "404":
          description: Pattern not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /validation/identifiertypes/all:
    get:
      tags:
        - validation
      security: []
      summary: Get all identifier types
      description: Returns all available identifier types with their validation patterns.
      operationId: getIdentifierTypes
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentifierTypesResponse"
        "404":
          description: No identifier types found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /validation/identifiertypes/active:
    get:
      tags:
        - validation
      security: []
      summary: Get active identifier types
      description: Returns only identifier types that are currently visible (`isShown = 1`).
      operationId: getActiveIdentifierTypes
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentifierTypesResponse"
        "404":
          description: No active identifier types found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /validation/identifiertypes/inactive:
    get:
      tags:
        - validation
      security: []
      summary: Get inactive identifier types
      description: Returns only identifier types that are currently hidden (`isShown = 0`).
      operationId: getInactiveIdentifierTypes
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentifierTypesResponse"
        "404":
          description: No inactive identifier types found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /dataset/export/{id}/{scheme}:
    get:
      tags:
        - dataset
      security: []
      summary: View dataset as XML or JSON-LD
      description: View a dataset in the specified metadata scheme. `datacite` and `iso` return XML, `jsonld` returns compact DataCite JSON-LD.
      operationId: exportDataset
      parameters:
        - name: id
          in: path
          description: Dataset ID to export
          required: true
          schema:
            type: integer
            format: int64
        - name: scheme
          in: path
          description: Metadata scheme for export
          required: true
          schema:
            type: string
            enum: [datacite, iso, jsonld]
      responses:
        "200":
          description: Successful operation
          content:
            application/xml:
              schema:
                type: string
                format: binary
                description: XML content of the dataset
            application/ld+json:
              schema:
                type: object
                description: Compact DataCite JSON-LD representation of the dataset
        "400":
          description: Invalid ID or scheme provided
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Dataset not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /dataset/export/{id}/{scheme}/download:
    get:
      tags:
        - dataset
      security: []
      summary: Download dataset as XML or JSON-LD
      description: Download a dataset in the specified metadata scheme. `datacite` and `iso` return XML, `jsonld` returns compact DataCite JSON-LD.
      operationId: exportDatasetDownload
      parameters:
        - name: id
          in: path
          description: Dataset ID to export
          required: true
          schema:
            type: integer
            format: int64
        - name: scheme
          in: path
          description: Metadata scheme for export
          required: true
          schema:
            type: string
            enum: [datacite, iso, jsonld]
      responses:
        "200":
          description: Successful operation
          content:
            application/xml:
              schema:
                type: string
                format: binary
                description: XML file for download
            application/ld+json:
              schema:
                type: string
                format: binary
                description: JSON-LD file for download
        "400":
          description: Invalid ID or scheme provided
