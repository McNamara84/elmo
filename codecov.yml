codecov:
  require_ci_to_pass: true

coverage:
  precision: 2
  round: down
  range: "60...100"
  status:
    project:
      default:
        target: auto
        threshold: 1%

flags:
  php:
    paths:
      - save/
      - includes/
    carryforward: true
  javascript:
    paths:
      - js/
    carryforward: true
