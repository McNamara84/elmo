services:
  db:
    image: mariadb:12.3.3-noble@sha256:99c125f103f5d081ebbc9ffe064e63daf7f688ac33a5f7f29af2d7260a96debf
    environment:
      MARIADB_ROOT_PASSWORD: ${ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      TZ: Europe/Berlin
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - internal

  web:
    # Template only: the publishing workflow pins this image to a validated digest.
    image: "${ELMO_STAGE_WEB_IMAGE:-ghcr.io/mcnamara84/elmo-web:deployment-template}"
    pull_policy: always
    healthcheck: &web-healthcheck
      test: ["CMD", "php", "/var/www/html/scripts/container_database.php", "healthcheck"]
      interval: 10s
      timeout: 8s
      retries: 3
      start_period: 180s
    environment:
      DB_HOST: db
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      ROOT_PASSWORD: ${ROOT_PASSWORD}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_AUTH: ${SMTP_AUTH}
      SMTP_SECURE: ${SMTP_SECURE}
      SMTP_SENDER: ${SMTP_SENDER}
      SIMULATE_EMAIL: "false"
      FEEDBACK_ADDRESS: ${FEEDBACK_ADDRESS}
      XML_SUBMIT_ADDRESS: ${XML_SUBMIT_ADDRESS}
      CONTACT_ADDRESS_REPOSITORY: ${CONTACT_ADDRESS_REPOSITORY:-datapub@gfz.de}
      TZ: Europe/Berlin
      ELMO_API_KEY: ${ELMO_API_KEY}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY}
      GOOGLE_MAPS_MAP_ID: ${GOOGLE_MAPS_MAP_ID:-}
      ERNIE_URL: ${ERNIE_URL}
      ERNIE_API_KEY: ${ERNIE_API_KEY}
      DATACITE_JSONLD_CONTEXT_URL: ${DATACITE_JSONLD_CONTEXT_URL}
      LOCAL_DEVELOPMENT: "false"
      DATA_UPLOAD_URL: ${DATA_UPLOAD_URL:-}
      FUNDER_PID: ${FUNDER_PID:-CFID}
      # Database install routine
      INSTALL_ACTION: basic
      # Flags for Standard ELMO
      SHOW_MSL_MODE: "false"
      SHOW_GGMS_PROPERTIES: ${SHOW_GGMS_PROPERTIES:-false}
      SHOW_USED_INSTRUMENTS: ${SHOW_USED_INSTRUMENTS:-false}
      SHOW_CONTACT_INSTITUTION: ${SHOW_CONTACT_INSTITUTION:-false}
      SHOW_THESAURI: "true"
      SHOW_FREE_KEYWORDS: "true"
      SHOW_SPATIAL_TEMPORAL_COVERAGE: "true"
      SHOW_RELATED_WORK: "true"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internal
      - frontend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.elmo-stage.rule=Host(`env.rz-vm182.gfz.de`) && PathPrefix(`/elmo`)"
      - "traefik.http.routers.elmo-stage.entrypoints=https"
      - "traefik.http.routers.elmo-stage.service=elmo-stage"
      - "traefik.http.routers.elmo-stage.middlewares=elmo-stage-stripprefix"
      - "traefik.http.middlewares.elmo-stage-stripprefix.stripprefix.prefixes=/elmo"
      - "traefik.http.services.elmo-stage.loadbalancer.server.port=80"
      - "traefik.docker.network=traefik"
    volumes:
      # Shared API responses cache: all variants see the same cached responses.
      # Ownership/mode come from the image (copied into a new named volume).
      - api_cache_volume:/var/www/html/storage/cache
      # Variant-specific drafts: isolated data, same image-seeded permissions.
      - web_drafts:/var/www/html/storage/drafts

  web-msl:
    image: "${ELMO_STAGE_WEB_IMAGE:-ghcr.io/mcnamara84/elmo-web:deployment-template}"
    pull_policy: always
    healthcheck: *web-healthcheck
    environment:
      DB_HOST: db
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      ROOT_PASSWORD: ${ROOT_PASSWORD}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_AUTH: ${SMTP_AUTH}
      SMTP_SECURE: ${SMTP_SECURE}
      SMTP_SENDER: ${SMTP_SENDER}
      FEEDBACK_ADDRESS: ${FEEDBACK_ADDRESS}
      XML_SUBMIT_ADDRESS: ${XML_SUBMIT_ADDRESS_MSL}
      CONTACT_ADDRESS_REPOSITORY: ${CONTACT_ADDRESS_REPOSITORY:-datapub@gfz.de}
      SIMULATE_EMAIL: "false"
      TZ: Europe/Berlin
      ELMO_API_KEY: ${ELMO_API_KEY}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY}
      GOOGLE_MAPS_MAP_ID: ${GOOGLE_MAPS_MAP_ID:-}
      ERNIE_URL: ${ERNIE_URL}
      ERNIE_API_KEY: ${ERNIE_API_KEY}
      DATACITE_JSONLD_CONTEXT_URL: ${DATACITE_JSONLD_CONTEXT_URL}
      LOCAL_DEVELOPMENT: "false"
      DATA_UPLOAD_URL: ${DATA_UPLOAD_URL:-}
      FUNDER_PID: ${FUNDER_PID:-CFID}
      # Flags for MSL (MSL-specific vocabularies enabled)
      SHOW_MSL_MODE: "true"
      SHOW_GGMS_PROPERTIES: "false"
      SHOW_USED_INSTRUMENTS: ${SHOW_USED_INSTRUMENTS:-false}
      SHOW_CONTACT_INSTITUTION: ${SHOW_CONTACT_INSTITUTION:-false}
      SHOW_THESAURI: "true"
      SHOW_FREE_KEYWORDS: "true"
      SHOW_SPATIAL_TEMPORAL_COVERAGE: "true"
      SHOW_RELATED_WORK: "true"
      INSTANCE_TITLE: "ELMO MSL Edition – GFZ Metadata Editor"
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internal
      - frontend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.elmo-stage-msl.rule=Host(`env.rz-vm182.gfz.de`) && PathPrefix(`/elmo-msl`)"
      - "traefik.http.routers.elmo-stage-msl.entrypoints=https"
      - "traefik.http.routers.elmo-stage-msl.service=elmo-stage-msl"
      - "traefik.http.routers.elmo-stage-msl.middlewares=elmo-stage-msl-stripprefix"
      - "traefik.http.middlewares.elmo-stage-msl-stripprefix.stripprefix.prefixes=/elmo-msl"
      - "traefik.http.services.elmo-stage-msl.loadbalancer.server.port=80"
      - "traefik.docker.network=traefik"
    volumes:
      - api_cache_volume:/var/www/html/storage/cache
      - web_msl_drafts:/var/www/html/storage/drafts

  web-igsn:
    image: "${ELMO_STAGE_WEB_IMAGE:-ghcr.io/mcnamara84/elmo-web:deployment-template}"
    pull_policy: always
    healthcheck: *web-healthcheck
    environment:
      DB_HOST: db
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      ROOT_PASSWORD: ${ROOT_PASSWORD}
      # No install routine
      INSTALL_ACTION: skip
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_AUTH: ${SMTP_AUTH}
      SMTP_SECURE: ${SMTP_SECURE}
      SMTP_SENDER: ${SMTP_SENDER}
      FEEDBACK_ADDRESS: ${FEEDBACK_ADDRESS}
      XML_SUBMIT_ADDRESS: ${XML_SUBMIT_ADDRESS}
      CONTACT_ADDRESS_REPOSITORY: ${CONTACT_ADDRESS_REPOSITORY:-datapub@gfz.de}
      TZ: Europe/Berlin
      ELMO_API_KEY: ${ELMO_API_KEY}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY}
      GOOGLE_MAPS_MAP_ID: ${GOOGLE_MAPS_MAP_ID:-}
      ERNIE_URL: ${ERNIE_URL}
      ERNIE_API_KEY: ${ERNIE_API_KEY}
      DATACITE_JSONLD_CONTEXT_URL: ${DATACITE_JSONLD_CONTEXT_URL}
      LOCAL_DEVELOPMENT: "false"
      DATA_UPLOAD_URL: ${DATA_UPLOAD_URL:-}
      FUNDER_PID: ${FUNDER_PID:-CFID}
      # Flags for IGSN (minimal form - most form groups disabled)
      SHOW_MSL_MODE: "false"
      SHOW_GGMS_PROPERTIES: "false"
      SHOW_USED_INSTRUMENTS: ${SHOW_USED_INSTRUMENTS:-false}
      SHOW_CONTACT_INSTITUTION: ${SHOW_CONTACT_INSTITUTION:-false}
      SHOW_THESAURI: "false"
      SHOW_FREE_KEYWORDS: "false"
      SHOW_SPATIAL_TEMPORAL_COVERAGE: "false"
      SHOW_RELATED_WORK: "false"
      INSTANCE_TITLE: "ELMO IGSN Edition – Alpha Version"
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_healthy
      web-msl:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internal
      - frontend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.elmo-stage-igsn.rule=Host(`env.rz-vm182.gfz.de`) && PathPrefix(`/elmo-igsn`)"
      - "traefik.http.routers.elmo-stage-igsn.entrypoints=https"
      - "traefik.http.routers.elmo-stage-igsn.service=elmo-stage-igsn"
      - "traefik.http.routers.elmo-stage-igsn.middlewares=elmo-stage-igsn-stripprefix"
      - "traefik.http.middlewares.elmo-stage-igsn-stripprefix.stripprefix.prefixes=/elmo-igsn"
      - "traefik.http.services.elmo-stage-igsn.loadbalancer.server.port=80"
      - "traefik.docker.network=traefik"
    volumes:
      - api_cache_volume:/var/www/html/storage/cache
      - web_igsn_drafts:/var/www/html/storage/drafts

volumes:
  db_data:
  api_cache_volume:
  web_drafts:
  web_msl_drafts:
  web_igsn_drafts:

networks:
  internal:
    driver: bridge
  frontend:
    external: true
    name: traefik
