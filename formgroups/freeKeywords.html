<div class="card mb-2">
  <div class="card-header">
    <b data-translate="keywords.free.title">Free Keywords</b>
  </div>
  <div class="card-body reduce-padding">
    <div id="group-freekeyword" class="form-floating">
      <div class="row align-items-center">
        <!-- Input field -->
        <div class="input-group input-margin-top-bottom">
          <label for="input-freekeyword" class="visually-hidden">Free Keyword</label>
          <input type="text" class="form-control input-with-help input-right-no-round-corners" name="freekeywords[]" id="input-freekeyword" value="" data-translate-placeholder="keywords.free.placeholder">
          <span class="input-group-text"><i class="bi bi-question-circle-fill" data-help-section-id="help-freeKeywords"></i>
          </span>
          <div class="col-auto p-2">
            <button type="button" class="btn btn-primary" id="button-add-csv" data-bs-toggle="modal"
              data-bs-target="#freeKeywordsCsvModal" data-translate="keywords.free.addCsv"> add csv file
              <span class="visually-hidden">add csv file</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Modal for CSV upload -->
<div class="modal fade" id="freeKeywordsCsvModal" tabindex="-1" aria-labelledby="freeKeywordsCsvModalLabel"
  aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">

      <div class="modal-header">
        <h2 class="modal-title fs-5" id="freeKeywordsCsvModalLabel" data-translate="keywords.free.modalTitle">
          Upload CSV file
        </h2>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>

      <div class="modal-body">
        <p class="mb-3" data-translate="keywords.free.modalDescription">
          Upload a CSV file or drag and drop it here.
        </p>

        <label for="input-freekeywords-csv" id="freekeywords-csv-dropzone"
          class="border rounded p-4 w-100 text-center d-block" style="cursor: pointer;">
          <div data-translate="keywords.free.dropzone">
            Drag and drop a CSV file here
          </div>
          <div class="text-muted" data-translate="keywords.free.selectFile">
            Or click to select a file
          </div>
        </label>

        <input type="file" id="input-freekeywords-csv" class="visually-hidden" accept=".csv,text/csv">

        <div class="mt-3">
          <p class="mb-2 small text-muted" data-translate="keywords.free.downloadHint">
          </p>
          <a href="/test_data/free-keywords-example.csv" download="free-keywords-example.csv"
            class="btn btn-outline-secondary" id="button-download-csv-test-files" data-translate="keywords.free.downloadSample">
            Download Example CSV File
          </a>
        </div>

        <div id="freekeywords-csv-filename" class="mt-3 text-muted"></div>
        <div id="freekeywords-csv-feedback" class="mt-2 small"></div>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" data-translate="keywords.free.cancel">
          Cancel
        </button>
        <button type="button" class="btn btn-primary" id="button-confirm-csv-upload" disabled
          data-translate="keywords.free.import">
          Import keywords
        </button>
      </div>

    </div>
  </div>
</div>
