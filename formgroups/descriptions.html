<div class="card mb-2">
  <div class="card-header"><b data-translate="descriptions.title">Descriptions</b>
    <i class="bi bi-question-circle-fill" data-help-section-id="help-descriptions-fg"></i>
  </div>
  <div id="group-description">
    <div class="accordion p-2" id="accordion-description">
      <!-- Abstract: statisch, Pflichtfeld, immer sichtbar -->
      <div class="accordion-item">
        <h2 class="accordion-header">
          <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#collapse-abstract"
            aria-expanded="true" aria-controls="collapse-abstract" data-translate="descriptions.abstract">
            Abstract
          </button>
        </h2>
        <div id="collapse-abstract" class="accordion-collapse collapse show" data-bs-parent="#accordion-description">
          <div class="accordion-body">
            <label for="input-abstract" class="visually-hidden">
              <span data-translate="descriptions.abstract">Abstract</span><span class="red-star">*</span>
            </label>
            <div class="input-group has-validation">
              <textarea class="form-control input-with-help input-right-no-round-corners textarea-description js-required-on-submit"
                data-translate-placeholder="descriptions.abstractPlaceholder" id="input-abstract"
                name="descriptionAbstract" required aria-describedby="abstract-help"></textarea>
              <span class="input-group-text">
                <i class="bi bi-question-circle-fill" id="abstract-help"
                  data-help-section-id="help-description-abstract"></i>
              </span>
            </div>
          </div>
        </div>
      </div>
      <!-- Dynamische Description Types werden hier per JS eingefügt -->
    </div>
  </div>
</div>
        </div>
      </div>
    </div>
  </div>
</div>
