name: Playwright Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["**"]
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-smoke:
    name: "Smoke Tests (${{ matrix.browser }})"
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: ~/.cache/ms-playwright
      PROFILE: elmo
      TEST_SCOPE: core-smoke
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_password
          MYSQL_DATABASE: mde2-msl-test
          MYSQL_USER: test_user
          MYSQL_PASSWORD: test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping --silent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, pdo_mysql, mysqli, zip
          tools: phpdbg

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: |
          composer install --prefer-dist --no-progress --no-suggest
          composer dump-autoload -o
          npm ci

      - name: Wait for MySQL to be ready
        run: |
          for i in {30..0}; do
            if mysqladmin ping -h127.0.0.1 --silent; then
              break
            fi
            echo 'Waiting for MySQL...'
            sleep 5
          done
          if [ "$i" = 0 ]; then
            echo >&2 'MySQL did not start in time.'
            exit 1
          fi

      - name: Grant privileges to test_user
        run: |
          mysql -h127.0.0.1 -uroot -proot_password -e "
            CREATE USER IF NOT EXISTS 'test_user'@'%' IDENTIFIED BY 'test_password';
            GRANT ALL PRIVILEGES ON *.* TO 'test_user'@'%';
            FLUSH PRIVILEGES;
          "

      - name: Create profile settings.php
        run: |
          set -euo pipefail

          case "${PROFILE}" in
            elmo)
              SHOW_MSL_LABS=false
              SHOW_MSL_VOCABS=false
              SHOW_MSL_LOGO=false
              SHOW_GGMS_PROPERTIES=false
              SHOW_USED_INSTRUMENTS=true
              SHOW_GCMD_THESAURI=true
              SHOW_FREE_KEYWORDS=true
              SHOW_SPATIAL_TEMPORAL_COVERAGE=true
              SHOW_RELATED_WORK=true
              ;;
            *)
              echo "Unsupported profile: ${PROFILE}" >&2
              exit 1
              ;;
          esac

          cat > settings.php <<PHP
          <?php
          function connectDb() {
              \$host = '127.0.0.1';
              \$username = 'test_user';
              \$password = 'test_password';
              \$database = 'mde2-msl-test';
              \$conn = new mysqli(\$host, \$username, \$password, \$database);
              return \$conn;
          }
          function getApiKey() {
              \$apiKeyGoogleMaps = '';
              echo json_encode(['apiKey' => \$apiKeyGoogleMaps]);
          }
          if (basename(__FILE__) == basename(\$_SERVER['PHP_SELF'])) {
              if (\$_SERVER['REQUEST_METHOD'] === 'GET') {
                  getApiKey();
              }
          }
          \$connection = connectDb();
          \$apiKeyElmo = '1234-1234-1234-1234';
          \$apiKeyTimezone = 'test_timezone_api_key';
          \$maxTitles = 2;

          \$showContributorPersons = true;
          \$showContributorInstitutions = true;
          \$showFundingReference = true;
          \$showAuthorInstitution = true;
          \$showLicense = true;

          \$showMslLabs = ${SHOW_MSL_LABS};
          \$showMslVocabs = ${SHOW_MSL_VOCABS};
          \$showMslLogo = ${SHOW_MSL_LOGO};
          \$showGGMsProperties = ${SHOW_GGMS_PROPERTIES};
          \$showUsedInstruments = ${SHOW_USED_INSTRUMENTS};
          \$showGcmdThesauri = ${SHOW_GCMD_THESAURI};
          \$showFreeKeywords = ${SHOW_FREE_KEYWORDS};
          \$showSpatialTemporalCoverage = ${SHOW_SPATIAL_TEMPORAL_COVERAGE};
          \$showRelatedWork = ${SHOW_RELATED_WORK};

          \$mslLabsUrl = 'https://raw.githubusercontent.com/UtrechtUniversity/msl_vocabularies/main/vocabularies/labs/laboratories.json';
          \$mslVocabsUrl = 'https://raw.githubusercontent.com/UtrechtUniversity/msl_vocabularies/main/vocabularies/combined/editor/';

          \$showFeedbackLink = true;
          \$smtpHost = 'smtp.test.de';
          \$smtpPort = 465;
          \$smtpUser = 'test_user';
          \$smtpPassword = 'test_password';
          \$smtpSender = 'test_sender@test.com';
          \$feedbackAddress = 'feedback@test.com';
          \$xmlSubmitAddress = 'xmlsubmit@test.com';
          PHP

      - name: Initialize database structure and lookup data
        run: php -r "require 'install.php'; createDatabaseStructure(\$connection); insertLookupData(\$connection);"

      - name: Shrink large JSON fixtures for faster page loads
        run: echo '[{"crossRefId":"100000001","name":"National Science Foundation"}]' > json/funders.json

      - name: Start PHP built-in web server
        run: |
          PHP_CLI_SERVER_WORKERS=4 php -d opcache.enable=1 -d opcache.enable_cli=1 -d opcache.jit_buffer_size=64M -d opcache.jit=1255 -S localhost:8000 ci-router.php > server.log 2>&1 &
          echo $! > server.pid
          sleep 2

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browser
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Verify server is running
        run: |
          for i in {1..10}; do
            if curl -sf http://localhost:8000/index.php > /dev/null; then
              echo "Server is responding on attempt $i"
              break
            fi
            echo "Waiting for server... ($i)"
            sleep 2
          done
          curl -sf http://localhost:8000/index.php > /dev/null || { echo "Server not reachable"; exit 1; }

      - name: Run core smoke tests
        run: >-
          npx playwright test
          --config=playwright.config.ci.ts
          --workers=2
          --project=${{ matrix.browser }}
          tests/playwright/features/header.spec.ts
          tests/playwright/features/help-toggle.spec.ts
          tests/playwright/features/language-preferences.spec.ts
          tests/playwright/flows/minimal-data-save.spec.ts
          tests/playwright/flows/minimal-data-submission.spec.ts
        env:
          CI: true

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-core-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 30

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-core-${{ matrix.browser }}
          path: test-results/
          retention-days: 30

      - name: Display server logs on failure
        if: failure()
        run: |
          echo "=== Server Log ==="
          cat server.log

      - name: Stop PHP server
        if: always()
        run: |
          if [ -f server.pid ]; then
            kill "$(cat server.pid)" || true
          fi

