services:
  db:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: ${ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      TZ: Europe/Berlin
    volumes:
      - db_data:/var/lib/mysql
    restart: unless-stopped

  web:
    build: .
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      ROOT_PASSWORD: ${ROOT_PASSWORD}
      INSTALL_ACTION: basic
      TZ: Europe/Berlin
      DB_INIT_MODE: drop_data
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY}
      ERNIE_URL: ${ERNIE_URL}
      ERNIE_API_KEY: ${ERNIE_API_KEY}
      DATA_UPLOAD_URL: ${DATA_UPLOAD_URL:-}
      FUNDER_PID: ${FUNDER_PID:-CFID}
      # Flags for MSL
      SHOW_MSL_LABS: "false"
      SHOW_MSL_VOCABS: "false"
      SHOW_MSL_DEFAULT_FREE_KEYWORDS: "false"
      SHOW_MSL_LOGO: "false"
      SHOW_USED_INSTRUMENTS: "true"
      SIMULATE_EMAIL: "true"
      API_BASE_URL: ${API_BASE_URL:-http://localhost:8080}
      LOCAL_DEVELOPMENT: "true"
    depends_on:
      - db
    restart: unless-stopped
    volumes:
      # Mount the entire project directory for live code changes.
      # This is only for development. No way to production.
      - .:/var/www/html


volumes:
  db_data: