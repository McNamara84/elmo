<main id="main-content" class="container-fluid my-3">
  <!-- Warning if JS is deactivated -->
  <noscript>
    <div class="alert alert-danger text-center">JavaScript is disabled. Please
      enable JavaScript to use this form.</div>
  </noscript>
  <div class="alert alert-info p-2">
    <div class="row">
      <div class="col-11 text-center" data-translate="alerts.languageWarning">Please fill out the form in english.</div>
    </div>
  </div>
  <form id="form-mde" method="post" action="index.php" class="needs-validation" novalidate>
    <input type="hidden" name="csrf-token" id="input-csrf-token" value="">
    <input type="hidden" name="resourceInformationPayload" id="resource-information-payload" value="">
    <div class="card mb-2" id="group-resourceinformation" data-resource-information-group>
      <div class="card-header"><b data-translate="resourceInfo.title"></b>
        <i class="bi bi-question-circle-fill" data-help-section-id="help-resourceinformation-fg"></i>
        <div class="small text-muted mt-1" data-translate="resourceInfo.introduction">Please specify general metadata for the data here</div>
      </div>
      <div class="card-body">
        <div class="row mb-2 align-items-end">
          <div class="col-12 col-md-5 p-1">
            <label for="input-resourceinformation-source-doi" class="form-label" data-translate="resourceInfo.sourceDoi"></label>
            <input type="text" class="form-control" id="input-resourceinformation-source-doi"
              autocomplete="off" aria-invalid="false" aria-describedby="source-doi-status" />
            <div id="source-doi-status" class="form-text" role="status" aria-live="polite"></div>
          </div>
          <div class="col-12 col-md-auto p-1">
            <button type="button" class="btn btn-outline-primary" id="button-resourceinformation-prefill-doi"
              data-translate="resourceInfo.prefillFromDoi"></button>
          </div>
        </div>
        <div class="row">
          <!-- Input field for DOI -->
          <div class="col-12 col-sm-6 col-md-6 col-lg-2 p-1">
            <div class="input-group has-validation">
              <div class="form-floating">
                <input type="text" class="form-control input-with-help input-right-no-round-corners input-greyed-out"
                  id="input-resourceinformation-doi" name="doi"
                  pattern="^10\.\d{4,9}\/[._;\/\(\)\-:A-Za-z0-9&lt;&gt;]+$" readonly />
                <label for="input-resourceinformation-doi" data-translate="resourceInfo.doi"></label>
                <div class="invalid-feedback" data-translate="resourceInfo.doiInvalid"></div>
                <div class="valid-feedback" data-translate="resourceInfo.doiValid"></div>
              </div>
              <div class="input-group-append">
                <button type="button" class="btn btn-outline-secondary" id="button-resourceinformation-edit-doi"
                  aria-label="Edit DOI" title="Edit DOI" data-translate-title="resourceInfo.editDoi"><i class="bi bi-pencil" aria-hidden="true"></i></button>
                <span class="input-group-text">
                  <i class="bi bi-question-circle-fill" data-help-section-id="help-resourceinformation-doi"></i>
                </span>
              </div>
            </div>
            <div id="submission-doi-status" class="form-text" role="status" aria-live="polite"></div>
          </div>
          <!-- Input field for Publication Year -->
          <div class="col-12 col-sm-6 col-md-6 col-lg-2 p-1">
            <div class="input-group has-validation">
              <div class="form-floating">
                <input type="text" inputmode="numeric" class="form-control input-with-help input-right-no-round-corners js-required-on-submit"
                  name="year" pattern="^(19(0[1-9]|[1-9][0-9])|20[0-9]{2}|21[0-4][0-9]|215[0-5])$" required
                  id="input-resourceinformation-publicationyear"/>
                <label for="input-resourceinformation-publicationyear">
                  <span data-translate="resourceInfo.publicationYear"></span><span class="red-star">*</span>
                </label>
                <div class="invalid-feedback" data-translate="resourceInfo.publicationYearInvalid"></div>
              </div>
              <div class="input-group-append">
                <span class="input-group-text">
                  <i class="bi bi-question-circle-fill"
                    data-help-section-id="help-resourceinformation-publicationyear"></i>
                </span>
              </div>
            </div>
          </div>
          <!-- Input field for Resource Type -->
          <div class="col-12 col-sm-12 col-md-12 col-lg-4 p-1">
            <div class="input-group has-validation">
              <div class="form-floating">
                <select class="form-select input-with-help input-right-no-round-corners js-required-on-submit"
                  id="input-resourceinformation-resourcetype" name="resourcetype" required>
                  <option disabled selected hidden value="" data-translate="general.choose"></option>
                </select>
                <label for="input-resourceinformation-resourcetype">
                  <span data-translate="resourceInfo.resourceType"></span><span class="red-star">*</span>
                </label>
                <div class="invalid-feedback" data-translate="general.pleaseChoose"></div>
              </div>
              <div class="input-group-append">
                <span class="input-group-text">
                  <i class="bi bi-question-circle-fill"
                    data-help-section-id="help-resourceinformation-resourcetype" role="button" tabindex="0"
                    aria-label="Resource type help" data-translate-title="resourceInfo.resourceTypeHelp"></i>
                </span>
              </div>
            </div>
          </div>
          <!-- Input field for Version -->
          <div class="col-12 col-sm-6 col-md-6 col-lg-2 p-1">
            <div class="input-group has-validation">
              <div class="form-floating">
                <input type="text" class="form-control input-with-help input-right-no-round-corners"
                  id="input-resourceinformation-version" name="version" pattern="^\d+\.\d+$"  />
                <label for="input-resourceinformation-version" data-translate="resourceInfo.version"></label>
                <div class="invalid-feedback" data-translate="resourceInfo.versionInvalid"></div>
              </div>
              <div class="input-group-append">
                <span class="input-group-text">
                  <i class="bi bi-question-circle-fill" data-help-section-id="help-resourceinformation-version"></i>
                </span>
              </div>
            </div>
          </div>
          <!-- Input field for Language -->
          <div class="col-12 col-sm-6 col-md-6 col-lg-2 p-1">
            <div class="input-group has-validation">
              <div class="form-floating">
                <select class="form-select js-required-on-submit" id="input-resourceinformation-language" name="language" required>
                  <option disabled selected hidden value="" data-translate="general.choose"></option>
                </select>
                <label for="input-resourceinformation-language">
                  <span data-translate="resourceInfo.datasetLanguage"></span><span class="red-star">*</span>
                </label>
              </div>
            </div>
          </div>
        </div>
        <!-- Spacing between rows -->
        <div class="space-between-row"></div>
        <div class="row">
          <!-- Input field Title -->
          <div class="col-10 col-sm-11 col-md-11 col-lg-11 p-1">
            <div class="input-group has-validation">
              <div class="form-floating">
                <input type="text" class="form-control input-with-help input-right-no-round-corners js-required-on-submit"
                  id="input-resourceinformation-title" name="title[]" required />
                <label for="input-resourceinformation-title">
                  <span data-translate="resourceInfo.resourceTitle"></span><span class="red-star">*</span>
                </label>
                <div class="invalid-feedback" data-translate="resourceInfo.resourceTitleInvalid"></div>
              </div>
              <div class="input-group-append">
                <span class="input-group-text">
                  <i class="bi bi-question-circle-fill" data-help-section-id="help-resourceinformation-title"></i>
                </span>
              </div>
            </div>
          </div>
          <!-- Input field for Title Type (hidden until second title) -->
          <div class="col-10 col-md-3 p-1 unvisible" id="container-resourceinformation-titletype">
            <div class="input-group has-validation">
              <div class="form-floating">
                <select class="form-select input-with-help input-right-no-round-corners"
                  id="input-resourceinformation-titletype" name="titleType[]" required>
                </select>
                <label for="input-resourceinformation-titletype">
                  <span data-translate="resourceInfo.titleType"></span><span class="red-star">*</span>
                </label>
                <div class="invalid-feedback" data-translate="general.pleaseChoose"></div>
              </div>
              <div class="input-group-append">
                <span class="input-group-text">
                  <i class="bi bi-question-circle-fill" data-help-section-id="help-resourceinformation-titletype"></i>
                </span>
              </div>
            </div>
          </div>
          <!-- Button for cloning new rows for other titles -->
          <div class="col-2 col-md-1 col-lg-1 p-1 d-flex justify-content-end align-items-center">
            <button type="button" class="btn btn-primary addTitle add-button" id="button-resourceinformation-addtitle"
             data-translate="general.add"></button>
          </div>
        </div>
      </div>
    </div>
