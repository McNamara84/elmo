  /validation/identifier-type:
    get:
      tags: [validation]
      summary: Confirm the type of a DOI-shaped identifier
      description: |-
        Queries the exact DataCite record and its client type to distinguish IGSN,
        RAiD and regular DOI. Only a DataCite 404 permits a Crossref lookup.
        Unconfirmed or unsupported records return a null type. Results are cached
        for six hours; unknown records for one minute. Registry failures are not cached.
        The shared disk cache is limited to 1,024 identifiers. Cache accesses reclaim
        expired entries globally; entries expiring soonest are evicted when full.
      operationId: detectIdentifierType
      parameters:
        - name: doi
          in: query
          required: true
          description: Canonical bare DOI name, such as 10.60510/gf1211s-47.
          schema:
            type: string
            maxLength: 2048
          example: 10.60510/gf1211s-47
      responses:
        "200":
          description: Confirmed type or unknown record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentifierDetection"
        "400":
          description: Invalid DOI parameter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentifierDetection"
        "502":
          description: Registry unavailable or invalid response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentifierDetection"
        "504":
          description: Registry lookup timed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentifierDetection"
  /validation/patterns/{type}:
    get:
      tags:
        - validation
      security: []
      summary: Retrieve regex pattern for validation
      description: Returns the regex pattern for validating the specified type
      operationId: getPattern
      parameters:
        - name: type
          in: path
          required: true
          schema:
            type: string
          description: The type for which to retrieve the validation pattern
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatternResponse"
        "404":
          description: Pattern not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /validation/identifiertypes/all:
    get:
      tags:
        - validation
      security: []
      summary: Get all identifier types
      description: Returns all available identifier types with their validation patterns.
      operationId: getIdentifierTypes
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentifierTypesResponse"
        "404":
          description: No identifier types found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /validation/identifiertypes/active:
    get:
      tags:
        - validation
      security: []
      summary: Get active identifier types
      description: >-
        Returns only identifier types that are currently visible (`isShown = 1`).
        When ERNIE is configured, its vocabulary and validation patterns are authoritative.
        Grouped validation alternatives are normalized into the legacy pattern field
        without substituting local format rules. Empty patterns remain empty.
      operationId: getActiveIdentifierTypes
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentifierTypesResponse"
        "404":
          description: No active identifier types found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /validation/identifiertypes/inactive:
    get:
      tags:
        - validation
      security: []
      summary: Get inactive identifier types
      description: Returns only identifier types that are currently hidden (`isShown = 0`).
      operationId: getInactiveIdentifierTypes
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentifierTypesResponse"
        "404":
          description: No inactive identifier types found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /dataset/export/{id}/{scheme}:
    get:
      tags:
        - dataset
      security: []
      summary: View dataset as XML or JSON-LD
      description: >-
        View a dataset in the specified metadata scheme. `datacite` and `iso` return XML,
        `jsonld` returns compact DataCite JSON-LD. XML exports preserve the mixed order
        of person and institution contributors and include contributor contacts.
      operationId: exportDataset
      parameters:
        - name: id
          in: path
          description: Dataset ID to export
          required: true
          schema:
            type: integer
            format: int64
        - name: scheme
          in: path
          description: Metadata scheme for export
          required: true
          schema:
            type: string
            enum: [datacite, iso, jsonld]
      responses:
        "200":
          description: Successful operation
          content:
            application/xml:
              schema:
                type: string
                format: binary
                description: XML content of the dataset
            application/ld+json:
              schema:
                type: object
                description: Compact DataCite JSON-LD representation of the dataset
        "400":
          description: Invalid ID or scheme provided
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Dataset not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /dataset/export/{id}/{scheme}/download:
    get:
      tags:
        - dataset
      security: []
      summary: Download dataset as XML or JSON-LD
      description: >-
        Download a dataset in the specified metadata scheme. `datacite` and `iso` return XML,
        `jsonld` returns compact DataCite JSON-LD. XML exports preserve the mixed order
        of person and institution contributors and include contributor contacts.
      operationId: exportDatasetDownload
      parameters:
        - name: id
          in: path
          description: Dataset ID to export
          required: true
          schema:
            type: integer
            format: int64
        - name: scheme
          in: path
          description: Metadata scheme for export
          required: true
          schema:
            type: string
            enum: [datacite, iso, jsonld]
      responses:
        "200":
          description: Successful operation
          content:
            application/xml:
              schema:
                type: string
                format: binary
                description: XML file for download
            application/ld+json:
              schema:
                type: string
                format: binary
                description: JSON-LD file for download
        "400":
          description: Invalid ID or scheme provided
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Dataset not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /dataset/export/{id}/all:
    get:
      tags:
        - dataset
      security: []
      summary: View all metadata formats
      description: >-
        View a dataset in all available metadata schemes combined in one XML document.
        DataCite and ISO sections preserve contributor order and include contributor contacts.
      operationId: exportAllFormats
      parameters:
        - name: id
          in: path
          description: Dataset ID to export
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Successful operation
          content:
            application/xml:
              schema:
                type: string
                format: binary
                description: Combined XML content
        "400":
          description: Invalid ID provided
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Dataset not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /dataset/export/{id}/all/download:
    get:
      tags:
        - dataset
      security: []
      summary: Download all metadata formats
      description: >-
        Download a dataset in all available metadata schemes as a single XML file.
        DataCite and ISO sections preserve contributor order and include contributor contacts.
      operationId: exportAllFormatsDownload
      parameters:
        - name: id
          in: path
          description: Dataset ID to export
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Successful operation
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
                description: Combined XML file for download
        "400":
          description: Invalid ID provided
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Dataset not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /dataset/icgem_export/{id}:
    get:
      tags:
        - dataset
      security: []
      summary: Export dataset in ICGEM format
      description: Retrieves dataset metadata combined with ICGEM-specific Global Gravitational Model (GGM) properties as an XML document.
      operationId: exportICGEMxml
      parameters:
        - name: id
          in: path
          description: Dataset ID to export
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Successful operation
          content:
            application/xml:
              schema:
                type: string
                format: binary
              example: |
                <?xml version="1.0" encoding="UTF-8"?>
                <icgemMetadata xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">
                  <modelName>EIGEN-6C4</modelName>
                  <modelType>Static</modelType>
                  <mathematicalRepresentation>Spherical harmonics</mathematicalRepresentation>
                  <degree>2190</degree>
                  <errors>formal</errors>
                  <tideSystem>tide-free</tideSystem>
                  <earthGravityConstant>3.986004415E+14</earthGravityConstant>
                  <radius>6378136.3</radius>
                  <DataSources>
                    <DataSource>
                      <sourceId>22</sourceId>
                      <sourceType>S</sourceType>
                      <description>composite description</description>
                      <SatelliteValueName>Space-based Platforms &gt; Earth Observation Satellites &gt; GRACE-FO</SatelliteValueName>
                      <SatelliteValueUri>https://gcmd.earthdata.nasa.gov/kms/concept/f75e34e2-ebe7-4a6c-8bf6-da596a36b632</SatelliteValueUri>
                      <SatelliteSchemeName>NASA/GCMD Earth Platforms Keywords</SatelliteSchemeName>
                      <SatelliteSchemeUri>https://gcmd.earthdata.nasa.gov/kms/concepts/concept_scheme/platforms</SatelliteSchemeUri>
                    </DataSource>
                    <DataSource>
                      <sourceId>23</sourceId>
                      <sourceType>S</sourceType>
                      <description>composite description</description>
                      <SatelliteValueName>Space-based Platforms &gt; Earth Observation Satellites &gt; Laser Geodetic Satellite (LAGEOS) &gt; LAGEOS-1</SatelliteValueName>
                      <SatelliteValueUri>https://gcmd.earthdata.nasa.gov/kms/concept/8124c4a5-fb77-455c-9ecd-3cf325fc12a9</SatelliteValueUri>
                      <SatelliteSchemeName>NASA/GCMD Earth Platforms Keywords</SatelliteSchemeName>
                      <SatelliteSchemeUri>https://gcmd.earthdata.nasa.gov/kms/concepts/concept_scheme/platforms</SatelliteSchemeUri>
                    </DataSource>
                  </DataSources>
                  <TemporalModelProperties>
                    <TemporalProperty>
                      <generatingInstitution>fdt</generatingInstitution>
                      <temporalResolutionDays>1</temporalResolutionDays>
                      <startDate>2026-01-10</startDate>
                      <endDate>2026-01-16</endDate>
                      <release>3</release>
                    </TemporalProperty>
                  </TemporalModelProperties>
                </icgemMetadata>
        "404":
          description: Dataset not found or contains no GGM data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /drafts:
    post:
      tags:
        - drafts
      summary: Create autosave draft
      description: Creates a new autosave draft for the active user session and returns metadata about the stored draft.
      operationId: createDraft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DraftRequest"
      responses:
        "201":
          description: Draft created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DraftMetadata"
        "422":
          description: Invalid payload provided
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /drafts/{id}:
    get:
      tags:
        - drafts
      summary: Get autosave draft
      description: Retrieves the autosave draft payload for the provided identifier if it belongs to the current session.
      operationId: getDraft
      parameters:
        - name: id
          in: path
          required: true
          description: Identifier of the draft to retrieve
          schema:
            type: string
            pattern: "^[a-f0-9]{32}$"
      responses:
        "200":
          description: Draft payload returned successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DraftRecord"
        "400":
          description: Draft identifier missing or malformed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Draft belongs to another session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "204":
          description: Draft not found for the current session (no body)
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      tags:
        - drafts
      summary: Update autosave draft
      description: Replaces the payload of an existing autosave draft belonging to the current session.
      operationId: updateDraft
      parameters:
        - name: id
          in: path
          required: true
          description: Identifier of the draft to update
          schema:
            type: string
            pattern: "^[a-f0-9]{32}$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DraftRequest"
      responses:
        "200":
          description: Draft updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DraftMetadata"
        "400":
          description: Draft identifier missing or malformed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Draft belongs to another session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Draft not found for the current session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Invalid payload provided
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags:
        - drafts
      summary: Delete autosave draft
      description: Removes the specified autosave draft from the current session storage.
      operationId: deleteDraft
      parameters:
        - name: id
          in: path
          required: true
          description: Identifier of the draft to delete
          schema:
            type: string
            pattern: "^[a-f0-9]{32}$"
      responses:
        "204":
          description: Draft deleted successfully
        "400":
          description: Draft identifier missing or malformed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Draft not found for the current session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /drafts/session/latest:
    get:
      tags:
        - drafts
      summary: Get latest draft for session
      description: Returns the latest autosave draft for the active user session when available.
      operationId: getLatestDraftForSession
      responses:
        "200":
          description: Latest draft returned successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DraftRecord"
        "204":
          description: No draft stored for the current session
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/cache/refresh:
    post:
      tags:
        - admin
      summary: Refresh all ERNIE caches
      description: |-
        Fetches every ERNIE vocabulary and writes its cache file. The request runs for at most 300 seconds.

        Authenticate with the `X-API-KEY` header. The value must match `ELMO_API_KEY`.

        Read the written files with `GET /admin/cache/status`. That response wraps an `AllCacheStatus` object, keyed by vocabulary slug.
      operationId: refreshAllCache
      parameters:
        - name: X-API-KEY
          in: header
          required: true
          schema:
            type: string
          description: API key. Must match the ELMO_API_KEY environment variable.
      responses:
        "200":
          description: Every cache file was refreshed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CacheRefreshResponse"
              example:
                success: true
                message: All ERNIE caches refreshed
                results:
                  resourceTypes: true
                  titleTypes: true
                  gemet: true
        "400":
          description: ERNIE is not configured
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                required:
                  - success
                  - message
              example:
                success: false
                message: ERNIE service is not configured
        "401":
          description: The X-API-KEY header is missing or does not match ELMO_API_KEY
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                  - error
              example:
                error: Invalid or missing API key
        "502":
          description: One or more vocabularies could not be refreshed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CacheRefreshResponse"
              example:
                success: false
                message: Some ERNIE caches failed to refresh
                failed:
                  - gemet
                results:
                  resourceTypes: true
                  titleTypes: true
                  gemet: false
  /admin/cache/status:
    get:
      tags:
        - admin
      summary: Get all ERNIE cache statuses
      description: |-
        Returns the file-cache status of every ERNIE vocabulary.

        The `resourceTypes` entry describes the cache for the effective editor profile
        (`elmo-msl` in MSL mode, otherwise `elmo`). Its response key is unchanged.

        Authenticate with the `X-API-KEY` header. The value must match `ELMO_API_KEY`.
      operationId: getAllCacheStatus
      parameters:
        - name: X-API-KEY
          in: header
          required: true
          schema:
            type: string
          description: API key. Must match the ELMO_API_KEY environment variable.
      responses:
        "200":
          description: Status of every vocabulary cache
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CacheStatusResponse"
        "400":
          description: ERNIE is not configured
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: ERNIE service is not configured
                required:
                  - success
                  - message
        "401":
          description: The X-API-KEY header is missing or does not match ELMO_API_KEY
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Invalid or missing API key
                required:
                  - error
  /doi/lookup/{doi}:
    get:
      tags:
        - doi
      security: []
      summary: Look up DOI metadata from DataCite
      description: |-
        Queries the DataCite REST API for the given DOI and returns the metadata attributes
        relevant for ELMO form pre-filling. Acts as a server-side proxy to avoid CORS issues.
        Returns a filtered subset of DataCite attributes (titles, creators, contributors, etc.).
      operationId: doiLookup
      parameters:
        - name: doi
          in: path
          required: true
          schema:
            type: string
          description: The full DOI string (e.g. "10.14454/qdd3-ps68")
          example: "10.14454/qdd3-ps68"
      responses:
        "200":
          description: DOI lookup result
          content:
            application/json:
              schema:
                type: object
                properties:
                  found:
                    type: boolean
                    description: Whether the DOI was found on DataCite
                  attributes:
                    type: object
                    description: Filtered DataCite metadata attributes (only present when found is true)
                    properties:
                      doi:
                        type: string
                        example: "10.14454/qdd3-ps68"
                      titles:
                        type: array
                        items:
                          type: object
                          properties:
                            title:
                              type: string
                            titleType:
                              type: string
                              nullable: true
                      creators:
                        type: array
                        items:
                          type: object
                          properties:
                            name:
                              type: string
                            givenName:
                              type: string
                            familyName:
                              type: string
                            nameType:
                              type: string
                            nameIdentifiers:
                              type: array
                              items:
                                type: object
                            affiliation:
                              type: array
                              items:
                                type: object
                      publicationYear:
                        type: integer
                        example: 2023
                      types:
                        type: object
                        properties:
                          resourceTypeGeneral:
                            type: string
                      language:
                        type: string
                        example: "en"
                      version:
                        type: string
                        nullable: true
                required:
                  - found
        "400":
          description: Invalid DOI format
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: DataCite API unreachable or returned an error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key to access protected endpoints. Required for /update/ endpoints and /admin/cache endpoints.
  schemas:
    IdentifierDetection:
      type: object
      required: [identifierType, status, source]
      properties:
        identifierType:
          type: [string, "null"]
          enum: [DOI, IGSN, RAiD, null]
        status:
          type: string
          enum: [detected, unknown, invalid, unavailable]
        source:
          type: [string, "null"]
          enum: [datacite, crossref, null]

    CacheRefreshResponse:
      type: object
      description: |-
        Body of a refresh that contacted ERNIE. A complete refresh omits `failed`.
        A partial refresh sets `success` to false and lists the slugs in `failed`.
      properties:
        success:
          type: boolean
          description: True only when every vocabulary cache was written.
        message:
          type: string
        failed:
          type: array
          description: Vocabulary slugs that failed. Present only on a partial refresh.
          items:
            type: string
        results:
          type: object
          description: Whether each vocabulary cache was written, keyed by slug.
          additionalProperties:
            type: boolean
      required:
        - success
        - message
        - results
    CacheStatusResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        status:
          $ref: "#/components/schemas/AllCacheStatus"
      required:
        - success
        - status
    ErnieCacheFileStatus:
      type: object
      description: Status of one ERNIE cache file.
      properties:
        exists:
          type: boolean
        valid:
          type: boolean
          description: True when the file exists and is younger than the cache TTL.
        lastUpdated:
          type: string
          nullable: true
          example: "2026-10-10 23:21:11"
        age:
          type: integer
          nullable: true
          description: Age of the cache file in seconds.
        ageFormatted:
          type: string
          nullable: true
          description: Human-readable age. Omitted when the file has no timestamp.
          example: 2 hours
        ttl:
          type: integer
          description: Cache time-to-live in seconds. Omitted when the file is missing or unreadable.
          example: 21600
        itemCount:
          type: integer
        error:
          type: string
          description: Present when the file exists but cannot be read.
          example: Unable to read cache file
      required:
        - exists
        - valid
        - lastUpdated
        - age
        - itemCount
    AllCacheStatus:
      type: object
      description: |-
        Map returned by getAllCacheStatus. This is an object, not a JSON array. Each property is a vocabulary slug and each value is that cache file's status. `GET /admin/cache/status` wraps this object in `CacheStatusResponse`.
      properties:
        resourceTypes:
          $ref: "#/components/schemas/ErnieCacheFileStatus"
        titleTypes:
          $ref: "#/components/schemas/ErnieCacheFileStatus"
        descriptionTypes:
          $ref: "#/components/schemas/ErnieCacheFileStatus"
        languages:
          $ref: "#/components/schemas/ErnieCacheFileStatus"
        contributorPersonRoles:
          $ref: "#/components/schemas/ErnieCacheFileStatus"
        contributorInstitutionRoles:
          $ref: "#/components/schemas/ErnieCacheFileStatus"
        relationTypes:
          $ref: "#/components/schemas/ErnieCacheFileStatus"
        identifierTypes:
          $ref: "#/components/schemas/ErnieCacheFileStatus"
        pid4instInstruments:
          $ref: "#/components/schemas/ErnieCacheFileStatus"
        mslLabs:
          $ref: "#/components/schemas/ErnieCacheFileStatus"
        gcmdScienceKeywords:
          $ref: "#/components/schemas/ErnieCacheFileStatus"
        gcmdPlatforms:
          $ref: "#/components/schemas/ErnieCacheFileStatus"
        gcmdInstruments:
          $ref: "#/components/schemas/ErnieCacheFileStatus"
        chronostratTimescale:
          $ref: "#/components/schemas/ErnieCacheFileStatus"
        gemet:
          $ref: "#/components/schemas/ErnieCacheFileStatus"
        thesauriAvailability:
          $ref: "#/components/schemas/ErnieCacheFileStatus"
      required:
        - resourceTypes
        - titleTypes
        - descriptionTypes
        - languages
        - contributorPersonRoles
        - contributorInstitutionRoles
        - relationTypes
        - identifierTypes
        - pid4instInstruments
        - mslLabs
        - gcmdScienceKeywords
        - gcmdPlatforms
        - gcmdInstruments
        - chronostratTimescale
        - gemet
        - thesauriAvailability
    License:
      type: object
      properties:
        rights_id:
          type: integer
          format: int64
          description: Unique identifier for the license
          example: 1
        name:
          type: string
          description: Full name of the license
          example: "Creative Commons Attribution 4.0 International"
        url:
          type: string
          format: uri
          description: URL to the license text
          example: "https://creativecommons.org/licenses/by/4.0/"
        forSoftware:
          type: integer
          enum: [0, 1]
          default: 0
          description: Indicates if license is suitable for software (1) or not (0)
      required:
        - rights_id
        - name
        - url
    SoftwareLicense:
      type: object
      properties:
        rights_id:
          type: integer
          format: int64
          description: Unique identifier for the software license
          example: 2
        name:
          type: string
          description: Full name of the software license
          example: "MIT License"
        url:
          type: string
          format: uri
          description: URL to the license text
          example: "https://opensource.org/licenses/MIT"
        forSoftware:
          type: integer
          enum: [1]
          default: 1
          description: Always 1 for software licenses
      required:
        - rights_id
        - name
        - url
        - forSoftware
    DraftRequest:
      type: object
      description: Request body for creating or updating an autosave draft.
      properties:
        payload:
          type: object
          description: Autosaved form data captured from the metadata editor.
          additionalProperties: true
      required:
        - payload
    DraftMetadata:
      type: object
      description: Metadata describing a persisted autosave draft.
      properties:
        id:
          type: string
          description: Unique identifier of the draft
          example: "4f2c1a7e2b7c4d9e8f6a1b0c2d3e4f5a"
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the draft was last updated (UTC, microsecond precision)
          example: "2024-05-18T12:34:56.123456Z"
        checksum:
          type: string
          description: SHA-256 checksum of the stored payload
          example: "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"
      required:
        - id
        - updatedAt
        - checksum
    DraftRecord:
      allOf:
        - $ref: "#/components/schemas/DraftMetadata"
        - type: object
          properties:
            payload:
              type: object
              description: Autosaved form data previously submitted by the user.
              additionalProperties: true
          required:
            - payload
    TimezonesUpdateResponse:
      type: object
      properties:
        message:
          type: string
          description: Status message of the update operation
          example: "Timezones successfully updated"
        timezones:
          type: array
          description: List of updated timezones
          items:
            $ref: "#/components/schemas/Timezone"
      required:
        - message
        - timezones
    Timezone:
      type: object
      properties:
        value:
          type: string
          description: The timezone identifier
          example: "Europe/Berlin"
        label:
          type: string
          description: The formatted timezone label
          example: "UTC+02:00 (Europe/Berlin)"
      required:
        - value
        - label
    VocabularyUpdate:
      type: object
      properties:
        message:
          type: string
          description: Status message of the update operation
          example: "Successfully updated MSL vocabularies"
        version:
          type: string
          description: Version of the updated vocabulary
          example: "1.3"
        timestamp:
          type: string
          format: date-time
          description: Time of the update
          example: "2024-11-16T20:30:22Z"
      required:
        - message
        - version
        - timestamp
    RelationsResponse:
      type: object
      properties:
        relations:
          type: array
          description: List of available relations
          items:
            $ref: "#/components/schemas/Relation"
      required:
        - relations
    Relation:
      type: object
      properties:
        id:
          type: integer
          description: Unique identifier of the relation
          example: 1
        name:
          type: string
          maxLength: 45
          description: Canonical DataCite relation type token used in metadata exports
          example: "IsCitedBy"
        label:
          type: string
          description: Human-readable relation type label for user interfaces
          example: "Is Cited By"
        description:
          type: string
          maxLength: 1000
          description: Description of the relation
          example: "Indicates that B cites A"
      required:
        - id
        - name
        - label
        - description
    MslLaboratoriesResponse:
      type: object
      description: ERNIE MSL laboratories vocabulary, including file metadata and the laboratory list.
      properties:
        version:
          type: string
        lastUpdated:
          type: string
        total:
          type: integer
        data:
          type: array
          items:
            $ref: "#/components/schemas/MslLaboratory"
      required:
        - data
    MslLaboratory:
      type: object
      properties:
        identifier:
          type: string
          description: Laboratory identifier
          example: "MSL-001"
        name:
          type: string
          description: Laboratory name
          example: "Max Planck Institute for Astronomy"
        display_name:
          type: string
          description: Label shown in the laboratory select
          example: "Max Planck Institute for Astronomy - Max Planck Society"
        affiliation_name:
          type: string
          example: "Max Planck Society"
        affiliation_ror:
          type: string
          example: "https://ror.org/05y42nb95"
        scientific_domain:
          type: string
          example: "Astronomy"
        country:
          type: string
          example: "Germany"
      required:
        - identifier
        - display_name
    RorAffiliation:
      type: object
      properties:
        id:
          type: string
          description: ROR identifier of the affiliation
          example: "https://ror.org/012m9bp23"
        name:
          type: string
          description: Preferred name of the affiliation
          example: "University of Applied Sciences Potsdam"
        other:
          type: array
          description: Alternative names (aliases, labels, acronyms)
          items:
            type: string
          example:
            - "FH Potsdam"
            - "Fachhochschule Potsdam University of Applied Sciences"
            - "Fachhochschule Potsdam"
            - "FHP"
      required:
        - id
        - name
        - other
    Error:
      type: object
      properties:
        error:
          type: string
          description: Error message
          example: "An error occurred"
      required:
        - error
    HealthResponse:
      type: object
      properties:
        message:
          type: string
          description: Health status message
          example: "I'm still alive..."
      required:
        - message
    ThesaurusAvailability:
      type: object
      description: |-
        Map of thesaurus slug to availability. Keys are ERNIE slugs such as science_keywords, platforms, instruments, chronostratigraphy, and gemet.
      additionalProperties:
        type: object
        properties:
          available:
            type: boolean
          displayName:
            type: string
        required:
          - available
          - displayName
      example:
        science_keywords:
          available: true
          displayName: GCMD Science Keywords
        platforms:
          available: true
          displayName: GCMD Platforms
    IcgemLookupEntry:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "icgem1.0"
        description:
          type: string
          nullable: true
      required:
        - id
        - name
    VocabularyTree:
      type: array
      description: Hierarchical structure of vocabulary terms
      items:
        $ref: "#/components/schemas/VocabularyNode"
    VocabularyNode:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the term
        text:
          type: string
          description: Display text of the term
        language:
          type: string
          description: Language code of the term
        scheme:
          type: string
          description: Name of the vocabulary scheme
        schemeURI:
          type: string
          format: uri
          description: URI of the vocabulary scheme
        description:
          type: string
          description: Description or synonyms (comma-separated)
        children:
          type: array
          description: Child terms in the hierarchy
          items:
            $ref: "#/components/schemas/VocabularyNode"
      required:
        - id
        - text
        - language
        - scheme
        - schemeURI
        - description
        - children
    Role:
      type: object
      description: |
        When served from ERNIE (default), only `name` and `forInstitutions` are returned.
        When falling back to the local database, additional fields like `role_id` and `ernie_id` may be present.
      properties:
        name:
          type: string
          description: Name of the role
          example: "Data Curator"
        forInstitutions:
          type: integer
          description: |
            Role type indicator:
            * `0` - for persons only
            * `1` - for institutions only
            * `2` - for both persons and institutions
          enum: [0, 1, 2]
          example: 0
        role_id:
          type: integer
          description: Local database identifier (only present in DB fallback responses)
          example: 1
        ernie_id:
          type: integer
          nullable: true
          description: ERNIE API identifier (only present in DB fallback responses)
          example: 5
      required:
        - name
        - forInstitutions
    FreeKeywordsResponse:
      type: array
      description: List of free keywords
      items:
        type: object
        properties:
          free_keyword:
            type: string
            description: The keyword text
            example: "carbon dioxide emission"
        required:
          - free_keyword
    PatternResponse:
      type: object
      properties:
        pattern:
          type: string
          description: Regular expression pattern for validation
          example: "^[a-zA-Z0-9]{10}$"
      required:
        - pattern
    IdentifierTypesResponse:
      type: object
      properties:
        identifierTypes:
          type: array
          description: List of identifier types
          items:
            $ref: "#/components/schemas/IdentifierType"
      required:
        - identifierTypes
    IdentifierType:
      type: object
      properties:
        name:
          type: string
          description: Name of the identifier type
          example: "DOI"
        pattern:
          type: string
          description: Regular expression pattern for validation
          example: "^10\\.\\d{4,9}/[-._;()/:A-Z0-9]+$"
        description:
          type: string
          description: Description of the identifier type
          example: "Digital Object Identifier"
      required:
        - name
        - pattern
        - description
    ResourceType:
      type: object
      properties:
        id:
          type: integer
          description: Unique identifier of the resource type
          example: 5
        resource_type_general:
          type: string
          description: General name of the resource type
          example: Dataset
        description:
          type: string
          description: Description of the resource type
          example: Data encoded in a defined structure.
      required:
        - id
        - resource_type_general
    Language:
      type: object
      properties:
        id:
          type: integer
          description: Unique identifier of the language
          example: 1
        code:
          type: string
          description: ISO 639-1 code of the language
          example: en
        name:
          type: string
          description: Name of the language
          example: English
      required:
        - id
        - code
        - name
    TitleType:
      type: object
      properties:
        id:
          type: integer
          description: Unique identifier of the title type (local database ID)
          example: 1
        name:
          type: string
          description: Name of the title type
          example: "Main Title"
      required:
        - id
        - name
    DescriptionType:
      type: object
      properties:
        id:
          type: integer
          description: Unique identifier of the description type (ERNIE ID)
          example: 1
        name:
          type: string
          description: Display name of the description type
          example: "Abstract"
        slug:
          type: string
          description: URL-friendly identifier used as form field key
          example: "Abstract"
      required:
        - id
        - name
        - slug
    Pid4instInstrument:
      type: object
      description: A scientific instrument from the PID4INST catalogue
      properties:
        pid:
          type: string
          description: Persistent identifier (Handle) of the instrument
          example: "21.11157/a9250866-bbec-4542-86b3-a5f78c0c6922"
        pidType:
          type: string
          description: Type of the persistent identifier
          example: "Handle"
        name:
          type: string
          description: Name of the instrument
          example: "MFC_001000_02"
        instrumentTypes:
          type: array
          description: List of instrument type classifications
          items:
            type: string
          example: ["Mass flow controller"]
      required:
        - pid
        - pidType
        - name
        - instrumentTypes
