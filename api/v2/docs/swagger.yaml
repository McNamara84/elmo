  /admin/cache/titletypes/refresh:
    post:
      tags:
        - admin
      summary: Refresh title types cache
      description: Forces a refresh of the ERNIE title types cache and syncs the data to the local database. Requires API key authentication. This endpoint is typically triggered by ERNIE after title type configuration changes.
      operationId: refreshTitleTypesCache
      responses:
        "200":
          description: Cache refreshed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Title types cache refreshed successfully"
                  itemCount:
                    type: integer
                    example: 5
                  lastUpdated:
                    type: string
                    format: date-time
                    example: "2026-02-27T10:30:00+00:00"
        "400":
          description: ERNIE service is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized - Invalid or missing API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Failed to fetch data from ERNIE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
