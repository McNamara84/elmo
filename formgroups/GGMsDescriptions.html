<div class="card mb-2">
  <div class="card-header"><b data-translate="descriptions.title">Descriptions</b>
    <i class="bi bi-question-circle-fill" data-help-section-id="help-descriptions-fg"></i>
  </div>
  <div id="group-description">
    <div class="accordion p-2" id="accordion-description">
      <div class="accordion-item">
        <h2 class="accordion-header">
          <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#collapse-abstract"
            aria-expanded="true" aria-controls="collapse-abstract" data-translate="descriptions.abstract">
            Abstract
          </button>
        </h2>
        <!-- Input field Abstract -->
        <div id="collapse-abstract" class="accordion-collapse collapse show" data-bs-parent="#accordion-description">
          <div class="accordion-body">
            <label for="input-abstract" class="visually-hidden">
              <span data-translate="descriptions.abstract">Abstract</span><span class="red-star">*</span>
            </label>
            <div class="input-group has-validation">
              <textarea class="form-control input-with-help input-right-no-round-corners textarea-description js-required-on-submit"
                data-translate-placeholder="descriptions.abstractPlaceholder" id="input-abstract"
                name="descriptionAbstract" required aria-describedby="abstract-help"></textarea>
              <span class="input-group-text">
                <i class="bi bi-question-circle-fill" id="abstract-help"
                  data-help-section-id="help-description-abstract"></i>
              </span>
            </div>
          </div>
        </div>
      </div>
      <div class="accordion-item">
        <h2 class="accordion-header">
          <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
            data-bs-target="#collapse-general-model-description" aria-expanded="false" aria-controls="collapse-general-model-description"
            data-translate="descriptions.generalModelDescription">
            General Model Description
          </button>
        </h2>
        <!-- Input field General Model Description -->
        <div id="collapse-general-model-description" class="accordion-collapse collapse" data-bs-parent="#accordion-description">
          <div class="accordion-body">
            <div class="input-group has-validation">
                <textarea class="form-control input-with-help input-right-no-round-corners textarea-description"
                  id="input-general-model-description" name="descriptionGeneralModelDescription"
                  data-translate-placeholder="descriptions.generalModelDescriptionPlaceholder"></textarea>
                <label for="input-general-model-description" data-translate="descriptions.generalModelDescription" class="visually-hidden">
                  General model description
                </label>
              <span class="input-group-text"><i class="bi bi-question-circle-fill"
                  data-help-section-id="help-description-general-model-description"></i></span>
            </div>
          </div>
        </div>
      </div>
      <div class="accordion-item">
        <h2 class="accordion-header">
          <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
            data-bs-target="#collapse-input-data" aria-expanded="false" aria-controls="collapse-input-data"
            data-translate="descriptions.inputData">
            Input data
          </button>
        </h2>
        <!-- Input field Input Data -->
        <div id="collapse-input-data" class="accordion-collapse collapse" data-bs-parent="#accordion-description">
          <div class="accordion-body">
            <div class="input-group has-validation">
                <textarea class="form-control input-with-help input-right-no-round-corners textarea-description"
                data-translate-placeholder="descriptions.inputDataPlaceholder" id="input-input-data"
                  name="descriptionInputData"></textarea>
                <label for="input-input-data" data-translate="descriptions.inputData" class="visually-hidden">
                  Input data
                </label>
              <span class="input-group-text"><i class="bi bi-question-circle-fill"
                  data-help-section-id="help-description-input-data"></i></span>
            </div>
          </div>
        </div>
      </div>
      <div class="accordion-item">
        <h2 class="accordion-header">
          <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
            data-bs-target="#collapse-processing-procedures" aria-expanded="false" aria-controls="collapse-processing-procedures"
            data-translate="descriptions.processingProcedures">
            Processing procedures
          </button>
        </h2>
        <!-- Input field Processing Procedures -->
        <div id="collapse-processing-procedures" class="accordion-collapse collapse" data-bs-parent="#accordion-description">
          <div class="accordion-body">
            <div class="input-group has-validation">
                <textarea class="form-control input-with-help input-right-no-round-corners textarea-description"
                data-translate-placeholder="descriptions.processingProceduresPlaceholder" id="input-processing-procedures"
                  name="descriptionProcessingProcedures"></textarea>
                <label for="input-processing-procedures" data-translate="descriptions.processingProcedures" class="visually-hidden">
                  Processing procedures
                </label>
              <span class="input-group-text"><i class="bi bi-question-circle-fill"
                  data-help-section-id="help-description-processing-procedures"></i></span>
            </div>
          </div>
        </div>
      </div>
      <div class="accordion-item">
        <h2 class="accordion-header">
          <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
            data-bs-target="#collapse-specific-features" aria-expanded="false" aria-controls="collapse-specific-features"
            data-translate="descriptions.specificFeaturesOfResultingGravityField">
            Specific features of resulting gravity field
          </button>
        </h2>
        <!-- Input field Specific Features of Resulting Gravity Field -->
        <div id="collapse-specific-features" class="accordion-collapse collapse" data-bs-parent="#accordion-description">
          <div class="accordion-body">
            <div class="input-group has-validation">
                <textarea class="form-control input-with-help input-right-no-round-corners textarea-description"
                data-translate-placeholder="descriptions.specificFeaturesOfResultingGravityFieldPlaceholder" id="input-specific-features"
                  name="descriptionSpecificFeaturesOfResultingGravityField"></textarea>
                <label for="input-specific-features" data-translate="descriptions.specificFeaturesOfResultingGravityField" class="visually-hidden">
                  Specific features of resulting gravity field
                </label>
              <span class="input-group-text"><i class="bi bi-question-circle-fill"
                  data-help-section-id="help-description-specific-features"></i></span>
            </div>
          </div>
        </div>
      </div>
      <div class="accordion-item">
        <h2 class="accordion-header">
          <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
            data-bs-target="#collapse-other" aria-expanded="false" aria-controls="collapse-other"
            data-translate="descriptions.other">
            Other
          </button>
        </h2>
        <!-- Input field Other -->
        <div id="collapse-other" class="accordion-collapse collapse" data-bs-parent="#accordion-description">
          <div class="accordion-body">
            <div class="input-group has-validation">
                <textarea class="form-control input-with-help input-right-no-round-corners textarea-description"
                data-translate-placeholder="descriptions.otherPlaceholder" id="input-other" name="descriptionOther"></textarea>
                <label for="input-other" data-translate="descriptions.other" class="visually-hidden">
                  Other
                </label>
              <span class="input-group-text"><i class="bi bi-question-circle-fill"
                  data-help-section-id="help-description-other"></i></span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
