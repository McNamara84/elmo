# Apache GZIP Compression Configuration for ELMO
# This configuration enables mod_deflate for optimal compression of static assets
# 
# Expected compression ratios:
# - JSON files: ~85% reduction (23 MB → ~3.5 MB)
# - JavaScript: ~70% reduction
# - CSS: ~80% reduction
# - HTML: ~70% reduction

<IfModule mod_deflate.c>
    # Enable compression for common MIME types
    AddOutputFilterByType DEFLATE application/javascript
    AddOutputFilterByType DEFLATE application/json
    AddOutputFilterByType DEFLATE application/xml
    AddOutputFilterByType DEFLATE application/xhtml+xml
    AddOutputFilterByType DEFLATE application/rss+xml
    AddOutputFilterByType DEFLATE application/atom+xml
    AddOutputFilterByType DEFLATE text/css
    AddOutputFilterByType DEFLATE text/html
    AddOutputFilterByType DEFLATE text/javascript
    AddOutputFilterByType DEFLATE text/plain
    AddOutputFilterByType DEFLATE text/xml
    AddOutputFilterByType DEFLATE image/svg+xml
    AddOutputFilterByType DEFLATE font/ttf
    AddOutputFilterByType DEFLATE font/otf
    # Note: WOFF/WOFF2 are already compressed formats, no benefit from GZIP
    AddOutputFilterByType DEFLATE application/vnd.ms-fontobject

    # Set compression level (1-9, 6 is a good balance between speed and compression)
    DeflateCompressionLevel 6

    # Handle browser quirks
    BrowserMatch ^Mozilla/4 gzip-only-text/html
    BrowserMatch ^Mozilla/4\.0[678] no-gzip
    BrowserMatch \bMSIE !no-gzip !gzip-only-text/html
    BrowserMatch \bMSI[E] !no-gzip !gzip-only-text/html

    # Add Vary header for proper caching
    <IfModule mod_headers.c>
        Header append Vary Accept-Encoding
    </IfModule>

    # Don't compress images (already compressed) or very small files
    SetEnvIfNoCase Request_URI \.(?:gif|jpe?g|png|ico|webp)$ no-gzip
    SetEnvIfNoCase Request_URI \.(?:exe|t?gz|zip|bz2|sit|rar)$ no-gzip
    SetEnvIfNoCase Request_URI \.pdf$ no-gzip

    # Log compression ratio (optional, for debugging)
    # DeflateFilterNote ratio
    # LogFormat '"%r" %b/%{ratio}n%%' deflate
</IfModule>

# Enable mod_expires for cache control (complementary optimization)
<IfModule mod_expires.c>
    ExpiresActive On
    
    # JSON files (thesauri, affiliations) - cache for 1 day
    ExpiresByType application/json "access plus 1 day"
    
    # Static assets - cache for 1 week
    ExpiresByType text/css "access plus 1 week"
    ExpiresByType application/javascript "access plus 1 week"
    ExpiresByType text/javascript "access plus 1 week"
    
    # Images - cache for 1 month
    ExpiresByType image/png "access plus 1 month"
    ExpiresByType image/gif "access plus 1 month"
    ExpiresByType image/jpeg "access plus 1 month"
    ExpiresByType image/svg+xml "access plus 1 month"
    ExpiresByType image/webp "access plus 1 month"
    ExpiresByType image/x-icon "access plus 1 month"
    
    # Fonts - cache for 1 month
    ExpiresByType font/ttf "access plus 1 month"
    ExpiresByType font/otf "access plus 1 month"
    ExpiresByType application/font-woff "access plus 1 month"
    ExpiresByType application/font-woff2 "access plus 1 month"
</IfModule>
