name: Playwright Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "**" ]

permissions:
  contents: read
  checks: write

jobs:
  playwright-tests:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: ~/.cache/ms-playwright
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            projects: chromium
          - browser: firefox
            projects: firefox-gem --project=firefox-igsn
          - browser: webkit
            projects: webkit
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_password
          MYSQL_DATABASE: mde2-msl-test
          MYSQL_USER: test_user
          MYSQL_PASSWORD: test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping --silent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3

    steps:
    - uses: actions/checkout@v4

    - name: Set up PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.5'
        extensions: mbstring, xml, xsl, dom, ctype, iconv, intl, pdo_sqlite, pdo_mysql, mysqli, zip
        tools: phpdbg

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'

    - name: Install dependencies
      run: |
        composer install --prefer-dist --no-progress --no-suggest
        composer dump-autoload -o
        npm ci

    - name: Wait for MySQL to be ready
      run: |
        for i in {30..0}; do
          if mysqladmin ping -h127.0.0.1 --silent; then
            break
          fi
          echo 'Waiting for MySQL...'
          sleep 5
        done
        if [ "$i" = 0 ]; then
          echo >&2 'MySQL did not start in time.'
          exit 1
        fi

    - name: Grant privileges to test_user
      run: |
        mysql -h127.0.0.1 -uroot -proot_password -e "
          CREATE USER IF NOT EXISTS 'test_user'@'%' IDENTIFIED BY 'test_password';
          GRANT ALL PRIVILEGES ON *.* TO 'test_user'@'%';
          FLUSH PRIVILEGES;
        "

    - name: Create settings.php
      run: |
        cat << 'EOF' > settings.php
        <?php
        function connectDb() {
            $host = '127.0.0.1';
            $username = 'test_user';
            $password = 'test_password';
            $database = 'mde2-msl-test';
            $conn = new mysqli($host, $username, $password, $database);
            return $conn;
        }
        $apiKeyGoogleMaps = getenv('GOOGLE_MAPS_API_KEY') ?: '';
        $mapIdGoogleMaps = getenv('GOOGLE_MAPS_MAP_ID') ?: '';
        function getSettings($setting) {
            global $apiKeyGoogleMaps, $mapIdGoogleMaps, $showMslLabs;
            header('Content-Type: application/json; charset=utf-8');
            switch ($setting) {
                case 'apiKey':
                    echo json_encode(['apiKey' => $apiKeyGoogleMaps, 'mapId' => $mapIdGoogleMaps]);
                    break;
                case 'all':
                    echo json_encode(['apiKey' => $apiKeyGoogleMaps, 'mapId' => $mapIdGoogleMaps, 'showMslLabs' => $showMslLabs]);
                    break;
                default:
                    echo json_encode(['error' => 'Unknown setting']);
                    break;
            }
            exit;
        }
        if (basename(__FILE__) == basename($_SERVER['PHP_SELF'])) {
            if ($_SERVER['REQUEST_METHOD'] === 'GET' && isset($_GET['setting'])) {
                getSettings($_GET['setting']);
            }
        }
        $connection = connectDb();
        $apiKeyElmo = '1234-1234-1234-1234';
        $apiKeyTimezone = 'test_timezone_api_key';
        $maxTitles = 2;
        $showFeedbackLink = true;
        $showLicense = true;
        $smtpHost = 'smtp.test.de';
        $smtpPort = 465;
        $smtpUser = 'test_user';
        $smtpPassword = 'test_password';
        $smtpSender = 'test_sender@test.com';
        $feedbackAddress = 'feedback@test.com';
        $mslLabsUrl = 'https://raw.githubusercontent.com/UtrechtUniversity/msl_vocabularies/main/vocabularies/labs/laboratories.json';
        $mslVocabsUrl = 'https://raw.githubusercontent.com/UtrechtUniversity/msl_vocabularies/main/vocabularies/combined/editor/';

        // Feature toggles from environment variables (set per PHP server instance)
        $SIMULATE_EMAIL = filter_var(getenv('SIMULATE_EMAIL') ?: 'true', FILTER_VALIDATE_BOOLEAN);

        $showMslLabs = false;
        $showMslVocabs = false;
        $showMslLogo = false;
        $showGGMsProperties = false;
        $showUsedInstruments = false;
        $showGcmdThesauri = true;
        $showFreeKeywords = true;
        $showSpatialTemporalCoverage = true;
        $showRelatedWork = true;
        $showContributorPersons = true;
        $showContributorInstitutions = true;
        $showFundingReference = true;
        $showAuthorInstitution = true;
        $xmlSubmitAddress = 'datapub@gfz.de';

        $envOverrides = [
            'SHOW_MSL_LABS' => 'showMslLabs',
            'SHOW_MSL_VOCABS' => 'showMslVocabs',
            'SHOW_MSL_LOGO' => 'showMslLogo',
            'SHOW_GGMS_PROPERTIES' => 'showGGMsProperties',
            'SHOW_USED_INSTRUMENTS' => 'showUsedInstruments',
            'SHOW_GCMD_THESAURI' => 'showGcmdThesauri',
            'SHOW_FREE_KEYWORDS' => 'showFreeKeywords',
            'SHOW_SPATIAL_TEMPORAL_COVERAGE' => 'showSpatialTemporalCoverage',
            'SHOW_RELATED_WORK' => 'showRelatedWork',
        ];
        foreach ($envOverrides as $envKey => $varName) {
            $envVal = getenv($envKey);
            if ($envVal !== false) {
                $$varName = filter_var($envVal, FILTER_VALIDATE_BOOLEAN);
            }
        }
        EOF

    - name: Initialize database structure and lookup data
      run: php -r "require 'install.php'; createDatabaseStructure(\$connection); insertLookupData(\$connection);"

    - name: Shrink large JSON fixtures for faster page loads
      run: echo '[{"crossRefId":"100000001","name":"National Science Foundation"}]' > json/funders.json

    - name: Start PHP servers for all ELMO instances
      run: |
        # ELMO Standard (Port 8000)
        SHOW_MSL_LABS=false SHOW_MSL_VOCABS=false SHOW_MSL_LOGO=false \
        SHOW_GGMS_PROPERTIES=false SHOW_USED_INSTRUMENTS=true \
        SHOW_GCMD_THESAURI=true SHOW_FREE_KEYWORDS=true \
        SHOW_SPATIAL_TEMPORAL_COVERAGE=true SHOW_RELATED_WORK=true \
        SIMULATE_EMAIL=true \
        PHP_CLI_SERVER_WORKERS=4 php \
        -S localhost:8000 ci-router.php > server-elmo.log 2>&1 &
        echo $! > server-elmo.pid

        # ELMO-GEM (Port 8001)
        SHOW_MSL_LABS=false SHOW_MSL_VOCABS=false SHOW_MSL_LOGO=false \
        SHOW_GGMS_PROPERTIES=true SHOW_USED_INSTRUMENTS=false \
        SHOW_GCMD_THESAURI=true SHOW_FREE_KEYWORDS=true \
        SHOW_SPATIAL_TEMPORAL_COVERAGE=false SHOW_RELATED_WORK=true \
        SIMULATE_EMAIL=true \
        PHP_CLI_SERVER_WORKERS=2 php \
        -S localhost:8001 ci-router.php > server-gem.log 2>&1 &
        echo $! > server-gem.pid

        # ELMO-IGSN (Port 8002)
        SHOW_MSL_LABS=false SHOW_MSL_VOCABS=false SHOW_MSL_LOGO=false \
        SHOW_GGMS_PROPERTIES=false SHOW_USED_INSTRUMENTS=true \
        SHOW_GCMD_THESAURI=false SHOW_FREE_KEYWORDS=false \
        SHOW_SPATIAL_TEMPORAL_COVERAGE=false SHOW_RELATED_WORK=false \
        SIMULATE_EMAIL=true \
        PHP_CLI_SERVER_WORKERS=2 php \
        -S localhost:8002 ci-router.php > server-igsn.log 2>&1 &
        echo $! > server-igsn.pid

        # ELMO-MSL (Port 8003)
        SHOW_MSL_LABS=true SHOW_MSL_VOCABS=true SHOW_MSL_LOGO=true \
        SHOW_GGMS_PROPERTIES=false SHOW_USED_INSTRUMENTS=false \
        SHOW_GCMD_THESAURI=true SHOW_FREE_KEYWORDS=true \
        SHOW_SPATIAL_TEMPORAL_COVERAGE=true SHOW_RELATED_WORK=true \
        SIMULATE_EMAIL=true \
        PHP_CLI_SERVER_WORKERS=2 php \
        -S localhost:8003 ci-router.php > server-msl.log 2>&1 &
        echo $! > server-msl.pid

        sleep 3

    - name: Smoke-test save endpoint with curl
      run: |
        echo "=== Testing save_data.php endpoint directly ==="
        # First, verify the server responds at all
        curl -s -o /dev/null -w "Homepage status: %{http_code}\n" http://localhost:8000/
        
        # Test the save endpoint with minimal POST data
        echo "--- POST to save_data.php (expect some response) ---"
        curl -v -X POST http://localhost:8000/save/save_data.php \
          -F "year=2025" \
          -F "resourcetype=5" \
          -F "title[0]=Test" \
          -F "titleType[0]=1" \
          -F "familyname[0]=Doe" \
          -F "givenname[0]=John" \
          -F "orcid[0]=0000-0001-2345-6789" \
          -F "Contact_familyname=Doe" \
          -F "Contact_givenname=John" \
          -F "Contact_email=test@example.com" \
          -F "abstract=Test abstract" \
          -F "dateCreated=2025-01-01" \
          -F "filename=smoke-test" \
          -F "action=save_and_download" \
          2>&1 | head -100
        
        echo ""
        echo "--- Server log after smoke test ---"
        grep -i "SAVE" server-elmo.log 2>/dev/null | tail -20 || echo "(no SAVE entries)"

    - name: Cache Playwright browsers
      id: playwright-cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
        restore-keys: |
          playwright-${{ runner.os }}-

    - name: Install Playwright Browsers
      env:
        PLAYWRIGHT_BROWSERS_PATH: ~/.cache/ms-playwright
      run: npx playwright install --with-deps ${{ matrix.browser }}

    - name: Verify servers are running
      run: |
        for port in 8000 8001 8002 8003; do
          for i in {1..10}; do
            if curl -sf "http://localhost:${port}/index.php" > /dev/null; then
              echo "Server on port ${port} is responding on attempt $i"
              break
            fi
            echo "Waiting for server on port ${port}... ($i)"
            sleep 2
          done
          curl -sf "http://localhost:${port}/index.php" > /dev/null || { echo "Server on port ${port} not reachable"; exit 1; }
        done

    - name: Run Playwright tests
      id: run_playwright_tests
      run: npx playwright test --config=playwright.config.ci.ts --workers=2 --project=${{ matrix.projects }}
      env:
        CI: true

    - name: Publish ELMO performance metrics
      id: publish_performance_metrics
      if: always()
      env:
        PLAYWRIGHT_PROJECT: ${{ matrix.browser }}
      run: |
        node <<'NODE'
        const fs = require('fs');
        const path = require('path');

        const project = process.env.PLAYWRIGHT_PROJECT || 'unknown';
        const metricsDir = path.join(process.cwd(), 'test-results', 'performance');

        // Collect metrics from all project outputs for this browser
        let allMetrics = [];
        if (fs.existsSync(metricsDir)) {
          for (const file of fs.readdirSync(metricsDir)) {
            if (file.endsWith('.json')) {
              try {
                allMetrics.push(JSON.parse(fs.readFileSync(path.join(metricsDir, file), 'utf8')));
              } catch (e) { /* skip invalid files */ }
            }
          }
        }

        if (allMetrics.length === 0) {
          console.log(`::warning::Performance metrics not found for ${project}.`);
          const outputsFile = process.env.GITHUB_OUTPUT;
          if (outputsFile) {
            fs.appendFileSync(outputsFile, 'load_time=n/a\n');
            fs.appendFileSync(outputsFile, 'navigation_duration=n/a\n');
            fs.appendFileSync(outputsFile, 'dom_content_loaded=n/a\n');
          }
          process.exit(0);
        }

        const toNumber = (value) => (typeof value === 'number' && Number.isFinite(value) ? value : undefined);
        const average = (values) => {
          const valid = values.filter((value) => typeof value === 'number' && Number.isFinite(value));
          if (valid.length === 0) return undefined;
          return valid.reduce((sum, value) => sum + value, 0) / valid.length;
        };

        const summaryPath = process.env.GITHUB_STEP_SUMMARY;
        const outputsFile = process.env.GITHUB_OUTPUT;
        let firstMetric = true;

        for (const metrics of allMetrics) {
          const browser = metrics.browser || project;
          const runs = Array.isArray(metrics.runs) ? metrics.runs : [];
          const runLoadTimes = runs
            .map((run) => (run && typeof run === 'object' ? toNumber(run.totalLoadTimeMs) : undefined))
            .filter((value) => value !== undefined);
          const runNavigationDurations = runs
            .map((run) => {
              const navigation = run && typeof run === 'object' ? run.navigation : undefined;
              return navigation && typeof navigation === 'object' ? toNumber(navigation.duration) : undefined;
            })
            .filter((value) => value !== undefined);
          const runDomContentLoaded = runs
            .map((run) => {
              const navigation = run && typeof run === 'object' ? run.navigation : undefined;
              return navigation && typeof navigation === 'object' ? toNumber(navigation.domContentLoadedEventEnd) : undefined;
            })
            .filter((value) => value !== undefined);

          const navigation = metrics.navigation && typeof metrics.navigation === 'object' ? metrics.navigation : undefined;
          const loadTime = toNumber(metrics.totalLoadTimeMs ?? metrics.averageLoadTimeMs) ?? average(runLoadTimes);
          const navigationDuration = (navigation && toNumber(navigation.duration)) ?? average(runNavigationDurations);
          const domContentLoaded = (navigation && toNumber(navigation.domContentLoadedEventEnd)) ?? average(runDomContentLoaded);

          const formattedLoad = loadTime !== undefined ? loadTime.toFixed(0) : 'n/a';
          const formattedDuration = navigationDuration !== undefined ? navigationDuration.toFixed(0) : 'n/a';
          const formattedDom = domContentLoaded !== undefined ? domContentLoaded.toFixed(0) : 'n/a';

          console.log(`::notice title=ELMO load time (${browser})::${browser} fully loaded in ${formattedLoad} ms`);

          if (firstMetric && outputsFile) {
            fs.appendFileSync(outputsFile, `load_time=${formattedLoad}\n`);
            fs.appendFileSync(outputsFile, `navigation_duration=${formattedDuration}\n`);
            fs.appendFileSync(outputsFile, `dom_content_loaded=${formattedDom}\n`);
            firstMetric = false;
          }

          if (summaryPath) {
            let summary = '';
            if (!fs.existsSync(summaryPath) || fs.statSync(summaryPath).size === 0) {
              summary += '| Instance | Fully loaded (ms) | Navigation duration (ms) | DOMContentLoaded (ms) |\n';
              summary += '| --- | ---: | ---: | ---: |\n';
            }
            summary += `| ${browser} | ${formattedLoad} | ${formattedDuration} | ${formattedDom} |\n`;
            fs.appendFileSync(summaryPath, summary);
          }
        }
        NODE

    - name: Report ELMO load time check run
      if: always()
      uses: actions/github-script@v7
      env:
        PLAYWRIGHT_PROJECT: ${{ matrix.browser }}
        LOAD_TIME_MS: ${{ steps.publish_performance_metrics.outputs.load_time }}
        NAVIGATION_DURATION_MS: ${{ steps.publish_performance_metrics.outputs.navigation_duration }}
        DOM_CONTENT_LOADED_MS: ${{ steps.publish_performance_metrics.outputs.dom_content_loaded }}
        PLAYWRIGHT_CONCLUSION: ${{ steps.run_playwright_tests.conclusion }}
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const project = process.env.PLAYWRIGHT_PROJECT || 'unknown';
          const loadTime = process.env.LOAD_TIME_MS;
          const navigationDuration = process.env.NAVIGATION_DURATION_MS;
          const domContentLoaded = process.env.DOM_CONTENT_LOADED_MS;
          const testConclusion = (process.env.PLAYWRIGHT_CONCLUSION || '').toLowerCase();

          if (!loadTime) {
            core.info(`No load time available for ${project}. Skipping check run.`);
            return;
          }

          const conclusionMap = {
            success: 'success',
            failure: 'failure',
            cancelled: 'cancelled',
            skipped: 'skipped',
            timed_out: 'timed_out',
            action_required: 'action_required',
          };

          const conclusion = conclusionMap[testConclusion] || (loadTime === 'n/a' ? 'neutral' : 'success');

          const owner = context.repo.owner;
          const repo = context.repo.repo;
          const headSha = context.sha;
          const now = new Date().toISOString();

          const metricsLines = [
            `• Fully loaded: ${loadTime} ms`,
          ];
          if (navigationDuration && navigationDuration !== 'n/a') {
            metricsLines.push(`• Navigation duration: ${navigationDuration} ms`);
          }
          if (domContentLoaded && domContentLoaded !== 'n/a') {
            metricsLines.push(`• DOMContentLoaded: ${domContentLoaded} ms`);
          }

          await github.rest.checks.create({
            owner,
            repo,
            name: `playwright-tests (${project}) load time`,
            head_sha: headSha,
            status: 'completed',
            started_at: now,
            completed_at: now,
            conclusion,
            output: {
              title: `ELMO fully loaded in ${loadTime} ms`,
              summary: metricsLines.join('\n'),
            },
            details_url: `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`,
          });

    - name: Debug what the browser actually sees
      if: failure()
      run: |
        echo "=== Debugging what each server returns ==="
        for port in 8000 8001 8002 8003; do
          echo "--- Port ${port} ---"
          curl -s "http://localhost:${port}/" | head -50
        done

    - name: Upload Playwright Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report-${{ matrix.browser }}
        path: playwright-report/
        retention-days: 30

    - name: Upload Test Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-${{ matrix.browser }}
        path: test-results/
        retention-days: 30

    - name: Display server logs on failure
      if: failure()
      run: |
        for instance in elmo gem igsn msl; do
          echo "=== Server Log (${instance}) ==="
          cat "server-${instance}.log" 2>/dev/null || echo "(no log)"
        done

    - name: Display SAVE-related log entries
      if: always()
      run: |
        echo "=== SAVE-related log entries from all servers ==="
        for instance in elmo gem igsn msl; do
          echo "--- ${instance} ---"
          grep -i "SAVE\|error\|fatal\|XSLTProcessor\|xsl" "server-${instance}.log" 2>/dev/null | tail -50 || echo "(no matches)"
        done

    - name: Stop PHP servers
      if: always()
      run: |
        for instance in elmo gem igsn msl; do
          if [ -f "server-${instance}.pid" ]; then
            kill "$(cat "server-${instance}.pid")" 2>/dev/null || true
          fi
        done