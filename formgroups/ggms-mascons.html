<div class="card mb-2 d-none" aria-hidden="true">
	<div class="card-header">
		<b>MASCON properties</b>
		<i class="bi bi-question-circle-fill" data-help-section-id="help-mascon-properties" aria-hidden="true"></i>
	</div>
	<div class="card-body">
		<div id="group-ggmsmascons">
			<input type="hidden" id="mascons-payload" name="masconsPayload" value="null">
			<div class="row">
				<!-- Shape of MASCON -->
				<div class="col-12 col-md-6 col-lg-3 p-1">
					<div class="input-group has-validation">
						<div class="form-floating">
							<select class="form-select form-control input-with-help input-right-no-round-corners required-on-submit" id="input-mascon-shape" name="mascon_shape">
								<option value="" selected>Choose...</option>
								<option value="Equal area">Equal area</option>
								<option value="Irregular shapes">Irregular shapes</option>
								<option value="Other">Other</option>
							</select>
							<label for="input-mascon-shape">Shape of MASCON</label>
						</div>
						<div class="input-group-append">
							<span class="input-group-text">
								<i class="bi bi-question-circle-fill" data-help-section-id="help-mascon-shape" aria-hidden="true"></i>
							</span>
						</div>
					</div>
				</div>
				<!-- Native resolution -->
				<div class="col-12 col-md-6 col-lg-3 p-1">
					<div class="input-group has-validation">
						<div class="form-floating">
							<input type="float" class="form-control input-with-help input-right-no-round-corners" id="input-mascon-spatial-resolution" name="mascon_spatial_resolution">
							<label for="input-mascon-spatial-resolution">Native resolution (in degrees)</label>
						</div>
						<div class="input-group-append">
							<span class="input-group-text">
								<i class="bi bi-question-circle-fill" data-help-section-id="help-mascon-resolution" aria-hidden="true"></i>
							</span>
						</div>
					</div>
				</div>
				<!-- Product resampled resolution -->
				<div class="col-12 col-md-6 col-lg-3 p-1">
					<div class="input-group has-validation">
						<div class="form-floating">
							<input type="float" class="form-control input-with-help input-right-no-round-corners" id="input-mascon-product-resolution" name="mascon_product_resolution">
							<label for="input-mascon-product-resolution">Product resolution (in degrees)</label>
						</div>
						<div class="input-group-append">
							<span class="input-group-text">
								<i class="bi bi-question-circle-fill" data-help-section-id="help-mascon-resolution" aria-hidden="true"></i>
							</span>
						</div>
					</div>
				</div>
				<!-- Mascon count -->
				<div class="col-12 col-md-6 col-lg-3 p-1">
					<div class="input-group has-validation">
						<div class="form-floating">
							<input type="number" min="0" class="form-control input-with-help input-right-no-round-corners" id="input-mascon-count" name="mascon_count">
							<label for="input-mascon-count">Mascon count</label>
							<div class="invalid-feedback">Please provide mascon count as an integer above 0.</div>
						</div>
						<div class="input-group-append">
							<span class="input-group-text">
								<i class="bi bi-question-circle-fill" data-help-section-id="help-mascon-count" aria-hidden="true"></i>
							</span>
						</div>
					</div>
				</div>
			</div>

			<div class="row mt-2">
				<!-- Land mask -->
				<!-- switch -->
				<div class="col-12 col-md-6 col-lg-4 p-1">
					<div class="input-group has-validation">
						<div class="form-floating">
						<select class="form-control input-with-help input-right-no-round-corners" id="input-land-mask-switch" name="land_mask_switch" required>
							<option value="" selected>Choose...</option>
							<option value="given">Given</option>
							<option value="not_given">Not given</option>
						</select>
						<label for="input-land-mask-switch">Land Mask</label>
						</div>
						<div class="input-group-append">
							<span class="input-group-text">
								<i class="bi bi-question-circle-fill" data-help-section-id="help-land-mask" aria-hidden="true"></i>
							</span>
						</div>
					</div>					
				</div>
				<div class="col-12 col-md-6 col-lg-4 p-1">
					<div class="input-group has-validation">
						<div class="form-floating">
							<input type="text" class="form-control input-with-help input-right-no-round-corners" id="input-land-mask" name="land_mask">
							<label for="input-land-mask">Land Mask details</label>
							<div class="invalid-feedback">Please provide land Mask details or choose "Not given".</div>
						</div>
					</div>
				</div>
				<!-- Uncertainty -->
				 	<!-- switch -->
				<div class="col-12 col-md-6 col-lg-4 p-1">
					<div class="input-group has-validation">
						<div class="form-floating">
						<select class="form-control input-with-help input-right-no-round-corners" id="input-mascon-uncertainty-switch" name="mascon_uncertainty_switch" required>
							<option value="" selected>Choose...</option>
							<option value="given">Given</option>
							<option value="not_given">Not given</option>
						</select>
						<label for="input-mascon-uncertainty-switch">Uncertainty</label>
						</div>
						<div class="input-group-append">
							<span class="input-group-text">
								<i class="bi bi-question-circle-fill" data-help-section-id="help-mascon-uncertainty" aria-hidden="true"></i>
							</span>
						</div>
					</div>					
				</div>	
				
				<div class="col-12 col-md-6 col-lg-4 p-1">
					<div class="input-group has-validation">
						<div class="form-floating">
							<input type="text" class="form-control input-with-help input-right-no-round-corners" id="input-uncertainty" name="uncertainty">
							<label for="input-uncertainty">Uncertainty <span class="text-danger">*</span></label>
							<div class="invalid-feedback">Please provide uncertainty.</div>
						</div>
					</div>
				</div>

				<!-- Scale Factor -->
				<div class="col-12 col-md-6 col-lg-4 p-1">
					<div class="input-group has-validation">
						<div class="form-floating">
							<input type="text" class="form-control input-with-help input-right-no-round-corners" id="input-scale-factor" name="scale_factor" required>
							<label for="input-scale-factor">Scale factor <span class="text-danger">*</span></label>
							<div class="invalid-feedback">Please provide scale factor.</div>
						</div>
						<div class="input-group-append">
							<span class="input-group-text">
								<i class="bi bi-question-circle-fill" data-help-section-id="help-scale-factor" aria-hidden="true"></i>
							</span>
						</div>
					</div>
				</div>
			</div>
			<div class="row mt-2">
				<!-- Regularisation Method -->
				<div class="col-12 col-md-6 col-lg-4 p-1">
					<div class="input-group has-validation">
						<div class="form-floating">
							<input type="text" class="form-control input-with-help input-right-no-round-corners" id="input-mascon-regularisation-method" name="mascon_regularisation_method">
							<label for="input-mascon-regularisation-method">Regularisation method</label>
						</div>
						<div class="input-group-append">
							<span class="input-group-text">
								<i class="bi bi-question-circle-fill" data-help-section-id="help-mascon-regularisation-method" aria-hidden="true"></i>
							</span>
						</div>
					</div>
				</div>
				<!-- GAD -->
				<div class="col-12 col-md-6 col-lg-4 p-1">
					<div class="input-group has-validation">
						<div class="form-floating">
							<input type="text" class="form-control input-with-help input-right-no-round-corners" id="input-gad" name="gad" required>
							<label for="input-gad">GAD <span class="text-danger">*</span></label>
							<div class="invalid-feedback">Please provide GAD.</div>
						</div>
						<div class="input-group-append">
							<span class="input-group-text">
								<i class="bi bi-question-circle-fill" data-help-section-id="help-gad" aria-hidden="true"></i>
							</span>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
</div>
