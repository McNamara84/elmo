<div class="card mb-2 d-none" aria-hidden="true">
	<div class="card-header">
		<b>MASCON properties</b>
		<i class="bi bi-question-circle-fill" data-help-section-id="help-mascon-properties" aria-hidden="true"></i>
	</div>
	<div class="card-body">
		<div id="group-ggmsmascons">
			<input type="hidden" id="mascons-payload" name="masconsPayload" value="null">
			<div class="row">
				<!-- Land MASCON -->
				<div class="col-12 col-md-6 col-lg-4 p-1">
					<div class="input-group has-validation">
						<div class="form-floating">
							<input type="text" class="form-control input-with-help input-right-no-round-corners" id="input-land-mascon" name="land_mascon" required>
							<label for="input-land-mascon">Land MASCON <span class="text-danger">*</span></label>
							<div class="invalid-feedback">Please provide land MASCON.</div>
						</div>
						<div class="input-group-append">
							<span class="input-group-text">
								<i class="bi bi-question-circle-fill" data-help-section-id="help-land-mascon" aria-hidden="true"></i>
							</span>
						</div>
					</div>
				</div>

				<!-- Time Bound -->
				<div class="col-12 col-md-6 col-lg-4 p-1">
					<div class="input-group has-validation">
						<div class="form-floating">
							<input type="text" class="form-control input-with-help input-right-no-round-corners" id="input-time-bound" name="time_bound" required>
							<label for="input-time-bound">Time bound <span class="text-danger">*</span></label>
							<div class="invalid-feedback">Please provide time bound.</div>
						</div>
						<div class="input-group-append">
							<span class="input-group-text">
								<i class="bi bi-question-circle-fill" data-help-section-id="help-time-bound" aria-hidden="true"></i>
							</span>
						</div>
					</div>
				</div>

				<!-- Data EWH -->
				<div class="col-12 col-md-6 col-lg-4 p-1">
					<div class="input-group has-validation">
						<div class="form-floating">
							<input type="text" class="form-control input-with-help input-right-no-round-corners" id="input-data-ewh" name="data_ewh" required>
							<label for="input-data-ewh">Data EWH <span class="text-danger">*</span></label>
							<div class="invalid-feedback">Please provide data EWH.</div>
						</div>
						<div class="input-group-append">
							<span class="input-group-text">
								<i class="bi bi-question-circle-fill" data-help-section-id="help-data-ewh" aria-hidden="true"></i>
							</span>
						</div>
					</div>
				</div>
			</div>

			<div class="row mt-2">
				<!-- Regularisation Method -->
				<div class="col-12 col-md-6 col-lg-4 p-1">
					<div class="input-group has-validation">
						<div class="form-floating">
							<input type="text" class="form-control input-with-help input-right-no-round-corners" id="input-mascon-regularisation-method" name="mascon_regularisation_method">
							<label for="input-mascon-regularisation-method">Regularisation method</label>
						</div>
						<div class="input-group-append">
							<span class="input-group-text">
								<i class="bi bi-question-circle-fill" data-help-section-id="help-mascon-regularisation-method" aria-hidden="true"></i>
							</span>
						</div>
					</div>
				</div>
				<!-- Shape of MASCON -->
				<div class="col-12 col-md-6 col-lg-4 p-1">
					<div class="input-group has-validation">
						<div class="form-floating">
							<input type="text" class="form-control input-with-help input-right-no-round-corners" id="input-mascon-shape" name="mascon_shape">
							<label for="input-mascon-shape">Shape of MASCON</label>
						</div>
						<div class="input-group-append">
							<span class="input-group-text">
								<i class="bi bi-question-circle-fill" data-help-section-id="help-mascon-shape" aria-hidden="true"></i>
							</span>
						</div>
					</div>
				</div>
				<!-- Spatial Resolution -->
				<div class="col-12 col-md-6 col-lg-4 p-1">
					<div class="input-group has-validation">
						<div class="form-floating">
							<input type="text" class="form-control input-with-help input-right-no-round-corners" id="input-mascon-spatial-resolution" name="mascon_spatial_resolution">
							<label for="input-mascon-spatial-resolution">Spatial resolution (degrees or kilometers)</label>
						</div>
						<div class="input-group-append">
							<span class="input-group-text">
								<i class="bi bi-question-circle-fill" data-help-section-id="help-spatial-resolution" aria-hidden="true"></i>
							</span>
						</div>
					</div>
				</div>
			</div>

			<div class="row mt-2">
				<!-- Uncertainty -->
				<div class="col-12 col-md-6 col-lg-4 p-1">
					<div class="input-group has-validation">
						<div class="form-floating">
							<input type="text" class="form-control input-with-help input-right-no-round-corners" id="input-uncertainty" name="uncertainty" required>
							<label for="input-uncertainty">Uncertainty <span class="text-danger">*</span></label>
							<div class="invalid-feedback">Please provide uncertainty.</div>
						</div>
						<div class="input-group-append">
							<span class="input-group-text">
								<i class="bi bi-question-circle-fill" data-help-section-id="help-uncertainty" aria-hidden="true"></i>
							</span>
						</div>
					</div>
				</div>

				<!-- Scale Factor -->
				<div class="col-12 col-md-6 col-lg-4 p-1">
					<div class="input-group has-validation">
						<div class="form-floating">
							<input type="text" class="form-control input-with-help input-right-no-round-corners" id="input-scale-factor" name="scale_factor" required>
							<label for="input-scale-factor">Scale factor <span class="text-danger">*</span></label>
							<div class="invalid-feedback">Please provide scale factor.</div>
						</div>
						<div class="input-group-append">
							<span class="input-group-text">
								<i class="bi bi-question-circle-fill" data-help-section-id="help-scale-factor" aria-hidden="true"></i>
							</span>
						</div>
					</div>
				</div>

				<!-- GAD -->
				<div class="col-12 col-md-6 col-lg-4 p-1">
					<div class="input-group has-validation">
						<div class="form-floating">
							<input type="text" class="form-control input-with-help input-right-no-round-corners" id="input-gad" name="gad" required>
							<label for="input-gad">GAD <span class="text-danger">*</span></label>
							<div class="invalid-feedback">Please provide GAD.</div>
						</div>
						<div class="input-group-append">
							<span class="input-group-text">
								<i class="bi bi-question-circle-fill" data-help-section-id="help-gad" aria-hidden="true"></i>
							</span>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
</div>
